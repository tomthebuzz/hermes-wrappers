services:
  team-portal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Loopback by default; set PORTAL_BIND=0.0.0.0 (or the tailnet IP) to
      # expose it beyond this machine.
      - "${PORTAL_BIND:-127.0.0.1}:${PORTAL_PORT:-8080}:8080"
    environment:
      - KANBAN_DB_PATH=/data/kanban.db
      - KANBAN_ATTACHMENTS_ROOT=/data/attachments
      - USERS_YAML_PATH=/config/users.yaml
      - HERMES_BRIDGE_URL=http://host.docker.internal:8765
      - HERMES_BRIDGE_API_KEY=${HERMES_BRIDGE_API_KEY:?set this to the hermes-bridge service's API key}
      - PORTAL_BASE_URL=${PORTAL_BASE_URL:-http://localhost:8080}
      - SESSION_SECRET=${SESSION_SECRET:?set a real random secret, not the dev default}
    volumes:
      # Mount the board's DIRECTORY read-only, not kanban.db alone: SQLite
      # keeps recent writes in kanban.db-wal, and a file-only mount hides it,
      # so the Portal would only see changes after a checkpoint. Non-default
      # boards keep db + attachments in their own dir, away from ~/.hermes/.env.
      - ${HOME}/.hermes/kanban/boards/${KANBAN_BOARD:-team}:/data:ro
      - ${USERS_YAML:-../users.yaml}:/config/users.yaml  # writable: profile self-service can update telegram_username
    restart: unless-stopped
