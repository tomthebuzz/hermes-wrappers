<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Portal</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#202530;--line:#303643;--text:#e7eaf0;--muted:#aab2c0;--blue:#3a7afe;--red:#c0392b;--gold:#d6a94a}
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:3;background:var(--panel);padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:18px}a,.link{color:#9ab8ff;cursor:pointer;text-decoration:none}main{padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.toolbar select,.toolbar input,input,textarea{background:#10131a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px}.toolbar select{min-width:140px}button{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:8px 12px;cursor:pointer}button.secondary{background:#424957}button.reject{background:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}.board-shell{overflow:auto}.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:12px;align-items:start}.column{min-height:60vh;background:#12151d;border:1px solid var(--line);border-radius:9px}.column.over{outline:2px dashed var(--blue)}.colhead{padding:11px;background:var(--panel2);border-radius:9px 9px 0 0;display:flex;justify-content:space-between;font-weight:700}.column-tools{display:flex;align-items:center;gap:8px}.add-btn{border-radius:50%;padding:0;width:24px;height:24px;line-height:22px;font-size:18px;background:#3a7afe}.colbody{padding:9px;min-height:55vh}.card{background:var(--panel);border:1px solid var(--line);padding:11px;border-radius:8px;margin-bottom:9px;cursor:pointer}.card:hover{border-color:#6587cb}.card.dragging{opacity:.4}.card.overdue{border-color:var(--red)}.tag{display:inline-block;background:#303643;border-radius:4px;padding:2px 6px;font-size:11px;margin:0 4px 4px 0}.red{color:#ff7373}.muted{color:var(--muted)}.priority{color:#ffd479;font-weight:700}.modal-back{position:fixed;inset:0;background:#000a;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal input,.modal textarea{width:100%;margin:5px 0 12px}.modal textarea{min-height:120px}.actions{display:flex;gap:8px;flex-wrap:wrap}.profile{max-width:600px}.status{margin:10px 0}.hidden{display:none!important}#login-screen{max-width:430px;margin:12vh auto;text-align:center;padding:20px}#login-screen input{width:100%;margin:8px 0}.artifact{cursor:pointer}.upload-label{display:inline-block;background:#424957;color:#fff;padding:8px 12px;border-radius:5px;cursor:pointer}.file-input{display:none}
.toast{position:fixed;right:16px;bottom:16px;z-index:20;max-width:min(420px,calc(100% - 32px));background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;display:none}.toast.ok{border-left-color:var(--blue)}
table.people{width:100%;border-collapse:collapse;margin:14px 0}table.people th,table.people td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}table.people input[type=checkbox]{width:18px;height:18px}.profile label{display:block}.profile input{display:block;width:100%;margin:5px 0 12px}.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.copyrow code{word-break:break-all}
.dash{padding:16px;max-width:1200px;margin:0 auto}.dash h2{margin:18px 0 8px;font-size:17px}.dash .top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dash select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.tile .big{font-size:26px;font-weight:600;line-height:1.1}.tile .sub{color:var(--muted);font-size:12px}.tile.ok{border-left:4px solid #2fbf71}.tile.warn{border-left:4px solid #e0a52a}.tile.crit,.tile.off_track{border-left:4px solid #e0443a}.tile.at_risk{border-left:4px solid #e0a52a}.tile.on_track,.tile.done{border-left:4px solid #2fbf71}.tile.unknown{border-left:4px solid var(--line)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--panel2);color:var(--muted)}.chip.ok,.chip.on_track,.chip.done,.chip.approved{background:#1f4d35;color:#9be2b8}.chip.warn,.chip.at_risk{background:#4d3d12;color:#f0cf7a}.chip.crit,.chip.off_track{background:#4d1f1c;color:#f0a39c}
.obj{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}.obj h3{margin:0 0 6px;font-size:15px}.kr{display:grid;grid-template-columns:1fr 150px 140px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.kr .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.kr .bar i{display:block;height:100%;background:var(--blue)}.kr small{color:var(--muted)}
.worklists{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.worklist ul{list-style:none;margin:6px 0 0;padding:0}.worklist li{padding:6px 0;border-top:1px solid var(--line);cursor:pointer}.worklist li:hover{color:var(--blue)}.spark{display:block;width:100%;height:36px;margin-top:6px}
button.danger{background:#7a2a24;color:#fff}ul.plain{list-style:none;padding:0;margin:6px 0}ul.plain li{padding:4px 0}.mini{color:var(--blue);cursor:pointer;font-size:12px}.mini:hover{text-decoration:underline}button.small{padding:5px 10px;font-size:12px}.form label{display:block;margin:8px 0;font-size:13px;color:var(--muted)}.form input,.form select,.form textarea{display:block;width:100%;margin-top:3px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}.row{display:flex;gap:8px;margin-top:10px}
.review{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;white-space:pre-wrap}.empty{color:var(--muted);padding:8px 0}
</style></head>
<body>
<div id="login-screen"><h2>Team Portal</h2><p>Sign in with your Telegram @username or your Matrix ID (@name:server).</p><input id="login-id" placeholder="@username or @name:server"><button onclick="requestLogin()">Send login link</button><p id="login-status" class="status"></p><p class="muted">New here? <a href="/help" target="_blank">Read the guide</a>.</p></div>
<div id="app" class="hidden">
<header><nav><a onclick="showView('dashboard')">Dashboard</a><a onclick="showView('board')">Kanban</a><a onclick="showView('artifacts')">Artifacts</a></nav><nav><a href="/help" target="_blank">Help</a><a id="nav-people" class="hidden" onclick="showView('people')">People</a><a onclick="showView('profile')">Profile</a><a onclick="logout()">Log out</a></nav></header>
<main><section id="dashboard-view" class="hidden dash"></section><section id="board-view"></section><section id="artifacts-view" class="hidden"></section><section id="people-view" class="hidden profile"></section><section id="profile-view" class="hidden profile"></section></main></div>
<div id="toast" class="toast" role="status" onclick="this.style.display='none'"></div>
<div id="modal-back" class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const COLS=[['triage','Triage'],['todo','Todo'],['ready','Ready'],['running','In Progress'],['review','Review'],['blocked','Blocked'],['done','Done'],['archived','Archived']];
let currentUser=null, tasksCache=[], filters={tenant:'',assignee:'',due:'',priority:''}, activeTask=null;
let toastTimer=null;function notify(msg,ok=false){const el=document.getElementById('toast');el.textContent=msg;el.classList.toggle('ok',ok);el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',8000)}
let assigneesCache=null;async function loadAssignees(){if(assigneesCache===null){try{assigneesCache=(await api('/api/assignees')).assignees||[]}catch(e){assigneesCache=[]}}return assigneesCache}
function assigneeOptions(selected){const names=[...assigneesCache||[]];if(selected&&!names.includes(selected))names.push(selected);return `<option value="">(unassigned)</option>`+names.map(n=>`<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}
function defaultAssignee(tenant){return (assigneesCache||[]).includes(tenant)?tenant:''}
const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
// A JS string literal for an inline handler: the browser HTML-decodes the attribute
// before running it, so esc() alone would let a quote break out of '...'.
const jsArg=v=>esc(JSON.stringify(String(v??'')));
async function api(path,opts={}){const r=await fetch(path,{credentials:'include',...opts});if(r.status===401){showLogin();throw Error('Not logged in')}const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||`Request failed (${r.status})`);if(j&&j.notice)notify(j.notice,true);return j}
function showLogin(){document.getElementById('login-screen').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
async function requestLogin(){const status=document.getElementById('login-status');try{await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('login-id').value.trim()})});status.textContent='Login link sent. Check your Matrix direct messages (or Telegram).';status.className='status'}catch(e){status.textContent=e.message;status.className='status red'}}
async function logout(){await fetch('/logout',{method:'POST',credentials:'include'});showLogin()}
function showView(view){for(const id of ['dashboard-view','board-view','artifacts-view','people-view','profile-view'])document.getElementById(id).classList.toggle('hidden',id!==`${view}-view`);if(view==='dashboard')loadDashboard();if(view==='board')loadBoard();if(view==='artifacts')loadArtifacts();if(view==='people')loadPeople();if(view==='profile')loadProfile()}
function dueBucket(date){if(!date)return 'none';const d=new Date(date),now=new Date();if(Number.isNaN(d.valueOf()))return 'none';if(d<now)return 'overdue';const start=new Date(now);start.setHours(0,0,0,0);const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);const end=new Date(start);end.setDate(start.getDate()+7);if(d<end)return 'week';const monthEnd=new Date(now.getFullYear(),now.getMonth()+1,1);if(d<monthEnd)return 'month';return 'later'}
function matchFilters(t){if(filters.tenant&&t.tenant!==filters.tenant)return false;if(filters.assignee==='mine'&&t.assignee!==currentUser?.name&&t.assignee!==currentUser?.telegram_username)return false;if(filters.assignee&&filters.assignee!=='mine'&&t.assignee!==filters.assignee)return false;if(filters.due&&dueBucket(t.due_date)!==filters.due)return false;if(filters.priority!==''&&String(t.priority??0)!==filters.priority)return false;return true}
function toolbar(data){const tenants=data.tenants||[];const assignees=[...new Set(data.tasks.map(t=>t.assignee).filter(Boolean))].sort();return `<div class="toolbar"><select onchange="filters.tenant=this.value;renderBoard()"><option value="">All teams</option>${tenants.map(x=>`<option ${filters.tenant===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select><select onchange="filters.assignee=this.value;renderBoard()"><option value="">All users</option><option value="mine" ${filters.assignee==='mine'?'selected':''}>My items</option>${assignees.map(x=>`<option value="${esc(x)}" ${filters.assignee===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="filters.due=this.value;renderBoard()"><option value="">Any due date</option><option value="overdue" ${filters.due==='overdue'?'selected':''}>Overdue</option><option value="week" ${filters.due==='week'?'selected':''}>Due this week</option><option value="month" ${filters.due==='month'?'selected':''}>Due this month</option><option value="later" ${filters.due==='later'?'selected':''}>Later</option><option value="none" ${filters.due==='none'?'selected':''}>No due date</option></select><select onchange="filters.priority=this.value;renderBoard()"><option value="">Any priority</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${filters.priority===String(n)?'selected':''}>Priority ${n}</option>`).join('')}</select><button onclick="clearFilters()" class="secondary">Clear</button></div>`}
function clearFilters(){filters={tenant:'',assignee:'',due:'',priority:''};renderBoard()}
async function openNewTask(status,tenant=null,keyResult=null){await loadAssignees();const tenants=window.boardTenants||[];if(!tenants.length){notify('No teams are configured on the board yet.');return}const selected=tenant||filters.tenant||tenants[0];document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>New card — ${esc(status)}</h2><button class="secondary" onclick="closeModal()">Close</button></div><label>Title<input id="new-title" placeholder="Task title" autofocus></label><label>Team<select id="new-tenant" onchange="document.getElementById('new-assignee').innerHTML=assigneeOptions(defaultAssignee(this.value))">${tenants.map(t=>`<option value="${esc(t)}" ${t===selected?'selected':''}>${esc(t)}</option>`).join('')}</select></label><label>Details<textarea id="new-body" placeholder="Description"></textarea></label><label>Priority<select id="new-priority">${[0,1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></label><label>Assignee (Hermes profile)<select id="new-assignee">${assigneeOptions(defaultAssignee(selected))}</select></label><label>Serves key result<select id="new-kr"><option value="">none</option></select></label>${status==='todo'?'<p class="muted">Hermes reserves Todo for dependency-gated cards. A standalone task will be placed in Ready instead.</p>':''}<button onclick="createNewTask('${status}')">Create card</button><div class="status" id="new-task-status"></div>`;document.getElementById('modal-back').style.display='flex';loadNewTaskKrs(selected,keyResult);document.getElementById('new-tenant').addEventListener('change',e=>loadNewTaskKrs(e.target.value,null))}
async function loadNewTaskKrs(tenant,selected){try{const k=await api('/api/okr/key-results?tenant='+encodeURIComponent(tenant));const sel=document.getElementById('new-kr');if(sel)sel.innerHTML='<option value="">none</option>'+k.key_results.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.title)} (${esc(x.objective)})</option>`).join('')}catch(e){}}
async function createNewTask(status){const title=document.getElementById('new-title').value.trim();if(!title){document.getElementById('new-task-status').textContent='Enter a title.';return}try{await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,tenant:document.getElementById('new-tenant').value,body:document.getElementById('new-body').value,assignee:document.getElementById('new-assignee').value||null,status,priority:Number(document.getElementById('new-priority').value),key_result:document.getElementById('new-kr')?.value||null})});closeModal();if(document.getElementById('dashboard-view').classList.contains('hidden'))await loadBoard();else loadDashboard()}catch(e){document.getElementById('new-task-status').textContent=e.message}}
async function loadBoard(){try{const d=await api('/api/board');tasksCache=d.tasks;renderBoard(d)}catch(e){}}
function renderBoard(data=null){const el=document.getElementById('board-view');if(data){tasksCache=data.tasks;window.boardTenants=data.tenants}const tenants=window.boardTenants||[...new Set(tasksCache.map(t=>t.tenant).filter(Boolean))];const filtered=tasksCache.filter(matchFilters);const groups=Object.fromEntries(COLS.map(([k])=>[k,[]]));const other=[];for(const t of filtered){(groups[t.status]||other).push(t)}const d={tenants,tasks:tasksCache};el.innerHTML=`<h2>Kanban board</h2>${toolbar(d)}<div class="board-shell"><div class="board">${COLS.map(([key,label])=>{const dragAttrs=key==='triage'?'':'ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropTask(event,\''+key+'\')"';return `<div class="column" data-status="${key}" ${dragAttrs}><div class="colhead">${label}<span class="column-tools"><span>${groups[key].length}</span><button class="add-btn" title="Create card in ${label}" onclick="event.stopPropagation();openNewTask('${key}')">+</button></span></div><div class="colbody">${groups[key].map(cardHtml).join('')||'<div class="muted">No cards</div>'}</div></div>`}).join('')}${other.length?`<div class="column"><div class="colhead">Other <span>${other.length}</span></div><div class="colbody">${other.map(cardHtml).join('')}</div></div>`:''}</div></div>`}
function cardHtml(t){return `<article class="card ${t.overdue?'overdue':''}" draggable="true" ondragstart="dragStart(event,${jsArg(t.id)})" ondragend="this.classList.remove('dragging')" onclick="openTask(${jsArg(t.id)})"><span class="tag">${esc(t.tenant||'')}</span><span class="tag">${esc(t.assignee||'Unassigned')}</span><span class="priority">P${esc(t.priority??0)}</span>${t.overdue?'<span class="red"> OVERDUE</span>':''}<h3>${esc(t.title)}</h3><div class="muted">${esc((t.body||'').slice(0,130))}</div><small class="muted">${esc(t.id)}${t.due_date?' · Due '+esc(new Date(t.due_date).toLocaleDateString()):''}</small></article>`}
function dragStart(e,id){e.dataTransfer.setData('text/task-id',id);e.currentTarget.classList.add('dragging')}
function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('over')};function leaveDrop(e){e.currentTarget.classList.remove('over')}
async function dropTask(e,status){e.preventDefault();e.currentTarget.classList.remove('over');const id=e.dataTransfer.getData('text/task-id');if(!id)return;try{const result=await api(`/api/tasks/${encodeURIComponent(id)}/transition`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await loadBoard();if(status==='todo'&&result.detail?.includes('Todo'))notify(result.detail)}catch(err){notify(err.message);loadBoard()}}
async function openTask(id){try{await loadAssignees();activeTask=await api('/api/tasks/'+encodeURIComponent(id));renderTaskModal(activeTask)}catch(e){notify(e.message)}}
function renderTaskModal(t){const canEdit=(currentUser?.tenants||[]).includes(t.tenant)||currentUser?.can_rollup;const comments=(t.comments||[]).map(c=>`<p><b>${esc(c.author)}</b> · ${esc(c.text||c.body)}</p>`).join('')||'<p class="muted">No comments.</p>';const attachments=(t.attachments||[]).map(a=>`<li><a href="/api/attachments/${a.id}" target="_blank">Preview ${esc(a.filename)}</a> <a href="/api/attachments/${a.id}?download=1">Download</a> <span class="muted">(${Math.ceil((a.size||0)/1024)} KB)</span></li>`).join('')||'<li class="muted">No files attached.</li>';document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>Task details</h2><button class="secondary" onclick="closeModal()">Close</button></div><label>Title<input id="edit-title" value="${esc(t.title)}" ${canEdit?'':'disabled'}></label><label>Details<textarea id="edit-body" ${canEdit?'':'disabled'}>${esc(t.body||'')}</textarea></label><div class="toolbar"><label>Priority<select id="edit-priority" ${canEdit?'':'disabled'}>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${Number(t.priority||0)===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Assignee<select id="edit-assignee" ${canEdit?'':'disabled'}>${assigneeOptions(t.assignee||'')}</select></label><span class="tag">${esc(t.tenant)} / ${esc(t.status)}</span></div><div class="actions">${canEdit?'<button onclick="saveTask()">Save changes</button>':''}${t.status==='ready'?`<button class="secondary" onclick="claimTask(${jsArg(t.id)})">Claim</button>`:''}${t.status==='review'&&t.can_review?`<button onclick="reviewArtifact(${jsArg(t.id)},true)">Approve</button><button class="reject" onclick="reviewArtifact(${jsArg(t.id)},false)">Request changes</button>`:''}</div><p class="muted">Due: ${esc(t.due_date||'not set')} · Review SLA: ${esc(t.sla_deadline||'not applicable')}${t.thread_url?` · <a href="https://${location.hostname}:8443${esc(t.thread_url)}" target="_blank">open the card's thread in chat</a>`:''}</p><hr><h3>Stakeholders</h3><div id="stakeholders">${stakeholdersHtml(t)}</div><hr><h3>Attachments</h3><ul>${attachments}</ul><label class="upload-label">Upload file<input class="file-input" type="file" onchange="uploadTaskAttachment(${jsArg(t.id)},this)"></label><hr><h3>Comments</h3><div>${comments}</div><textarea id="new-comment" placeholder="Add a comment"></textarea><button onclick="addComment(${jsArg(t.id)})">Add comment</button><div class="status" id="modal-status"></div>`;document.getElementById('modal-back').style.display='flex'}
function stakeholdersHtml(t){const me=currentUser?.matrix_id;const rows=(t.stakeholders||[]).map(l=>`<li><span class="chip">${esc(l.role)}</span> ${esc(l.person)}${(l.serves||[]).length?` <small class="muted">· serves ${l.serves.map(k=>esc(k.title)).join(', ')}</small>`:''}${(t.can_name_stakeholders||l.matrix_id===me)?` <a class="mini" onclick="removeStakeholder(${jsArg(t.id)},${jsArg(l.id)})">remove</a>`:''}</li>`).join('')||'<li class="muted">Nobody named yet. Named reviewers are the only ones who may approve this card.</li>';
return `<ul class="plain">${rows}</ul><div class="row"><select id="sh-member"><option value="">loading…</option></select><select id="sh-role"><option value="watcher">watcher</option>${t.can_name_stakeholders?'<option value="reviewer">reviewer</option><option value="owner">owner</option>':''}</select><select id="sh-kr" class="hidden"><option value="">serves no key result</option></select><button class="small" onclick="addStakeholder(${jsArg(t.id)})">Add</button></div><div class="status" id="sh-status"></div>${loadStakeholderOptions(t)?'':''}`}
async function loadStakeholderOptions(t){try{const [m,k]=await Promise.all([api('/api/members?tenant='+encodeURIComponent(t.tenant)),api('/api/okr/key-results?tenant='+encodeURIComponent(t.tenant))]);const sel=document.getElementById('sh-member');if(!sel)return;const me=currentUser?.matrix_id;sel.innerHTML=m.members.map(x=>`<option value="${esc(x.matrix_id)}" ${x.matrix_id===me?'selected':''}>${esc(x.name)}${x.can_approve?' ✓':''}</option>`).join('');const kr=document.getElementById('sh-kr');if(k.key_results.length){kr.classList.remove('hidden');kr.innerHTML='<option value="">serves no key result</option>'+k.key_results.map(x=>`<option value="${esc(x.id)}">${esc(x.title)} (${esc(x.objective)})</option>`).join('')}}catch(e){}}
async function addStakeholder(id){const status=document.getElementById('sh-status');status.textContent='Saving…';try{await api(`/api/tasks/${encodeURIComponent(id)}/stakeholders`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({matrix_id:document.getElementById('sh-member').value,role:document.getElementById('sh-role').value,key_result:document.getElementById('sh-kr').value||null})});await openTask(id)}catch(e){status.textContent=e.message}}
async function removeStakeholder(id,linkId){try{await api(`/api/tasks/${encodeURIComponent(id)}/stakeholders/${encodeURIComponent(linkId)}/delete`,{method:'POST'});await openTask(id)}catch(e){notify(e.message)}}
function closeModal(){document.getElementById('modal-back').style.display='none';activeTask=null}
async function saveTask(){const t=activeTask;try{await api('/api/tasks/'+encodeURIComponent(t.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('edit-title').value,body:document.getElementById('edit-body').value,priority:Number(document.getElementById('edit-priority').value),assignee:document.getElementById('edit-assignee').value||(t.assignee?'none':null)})});await openTask(t.id);loadBoard()}catch(e){notify(e.message)}}
async function claimTask(id){try{await api(`/api/tasks/${encodeURIComponent(id)}/claim`,{method:'POST'});await openTask(id);loadBoard()}catch(e){notify(e.message)}}
async function addComment(id){const text=document.getElementById('new-comment').value.trim();if(!text)return;try{await api(`/api/tasks/${encodeURIComponent(id)}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});await openTask(id);loadBoard()}catch(e){notify(e.message)}}
async function uploadTaskAttachment(id,input){const file=input.files?.[0];if(!file)return;const form=new FormData();form.append('file',file);try{await api(`/api/tasks/${encodeURIComponent(id)}/attachments`,{method:'POST',body:form});input.value='';if(activeTask?.id===id)await openTask(id);await loadArtifacts()}catch(e){notify(e.message)}}
async function loadArtifacts(){try{const d=await api('/api/artifacts');const cards=d.tasks.map(t=>{const actions=t.can_review?`<button onclick="reviewArtifact(${jsArg(t.id)},true)">Approve</button><button class="reject" onclick="reviewArtifact(${jsArg(t.id)},false)">Request changes</button>`:'<span class="muted">View only</span>';const hours=t.sla_seconds_remaining===null?null:(t.sla_seconds_remaining/3600).toFixed(1);const lvl=t.autonomy_level;const sla=hours===null?'No deadline':(t.auto_approves?`auto-approves in ${hours}h unless you object`:lvl!==null?`${hours}h left · needs your decision`:`${hours}h left`);const level=lvl===null?'':`<span class="tag" title="Autonomy level from autonomy.yaml">Level ${lvl}</span>`;return `<article class="card artifact ${t.sla_seconds_remaining!==null&&t.sla_seconds_remaining<0?'overdue':''}" onclick="openTask(${jsArg(t.id)})"><span class="tag">${esc(t.tenant)}</span>${level}<span class="tag">${sla}</span><h3>${esc(t.title)}</h3><p>${esc(t.body||'')}</p><div class="actions" onclick="event.stopPropagation()">${actions}<label class="upload-label">Upload file<input class="file-input" type="file" onchange="uploadTaskAttachment(${jsArg(t.id)},this)"></label></div></article>`}).join('');document.getElementById('artifacts-view').innerHTML=`<h2>Artifact review</h2><p class="muted">Open a card for details, comments, and review actions.</p>${cards||'<p>No artifacts awaiting review.</p>'}`}catch(e){}}
function reviewArtifact(id,approve){document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${approve?'Approve artifact':'Request changes'}</h2><button class="secondary" onclick="closeModal()">Cancel</button></div><label>${approve?'Approval note (optional)':'What needs to change?'}<textarea id="review-note" placeholder="${approve?'Optional note for the record':'Concrete changes the implementer should make'}"></textarea></label><button class="${approve?'':'reject'}" onclick="submitReview(${jsArg(id)},${approve})">${approve?'Approve':'Send back for changes'}</button><div class="status" id="review-status"></div>`;document.getElementById('modal-back').style.display='flex';document.getElementById('review-note').focus()}
async function submitReview(id,approve){const note=document.getElementById('review-note').value.trim();if(!approve&&!note){document.getElementById('review-status').textContent='Describe the changes you need.';return}try{await api('/api/artifacts/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,approve,note})});closeModal();notify(approve?'Approved.':'Sent back for changes.',true);await loadArtifacts();loadBoard()}catch(e){document.getElementById('review-status').textContent=e.message}}
let dashTenant=null;
function spark(ms){const v=ms.map(m=>Number(m.value)).filter(x=>!Number.isNaN(x));if(v.length<2)return '';const w=200,h=36,min=Math.min(...v),max=Math.max(...v),span=max-min||1;const pts=v.map((x,i)=>`${(i/(v.length-1))*w},${h-2-((x-min)/span)*(h-4)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="#3a7afe" stroke-width="1.5" points="${pts}"/></svg>`}
function fmtNum(v){if(v===null||v===undefined||v==='')return '–';const n=Number(v);return Number.isNaN(n)?esc(v):(Math.round(n*100)/100).toLocaleString()}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso);return Number.isNaN(d.valueOf())?esc(iso):d.toLocaleDateString()}
let dashData=null;
function krHtml(kr){const start=Number(kr.start??0),target=Number(kr.target),cur=Number(kr.current);let pct=0;if(!Number.isNaN(target)&&!Number.isNaN(cur)){const span=target-start;pct=span===0?100:Math.max(0,Math.min(100,Math.round(((cur-start)/span)*100)))}const last=kr.measurements?.length?kr.measurements[kr.measurements.length-1]:null;return `<div class="kr"><div><b>${esc(kr.title)}</b><br><small>${fmtNum(kr.current)} / ${fmtNum(kr.target)} ${esc(kr.unit||'')}${last?` · ${last.method==='manual'?'check-in':'measured'} ${fmtDate(last.at)}${last.actor&&last.method==='manual'?' by '+esc(last.actor):''}`:' · no check-in yet'}</small></div><div><div class="bar"><i style="width:${pct}%"></i></div><small>${pct}%</small></div><div><span class="chip ${esc(kr.status||'')}">${esc((kr.status||'no status').replace('_',' '))}</span><br><a class="mini" onclick="checkinForm(${jsArg(kr.id)},${jsArg(kr.title)},${jsArg(kr.unit||'')})">check in</a> · <a class="mini" onclick="openNewTask('ready',dashData.tenant,${jsArg(kr.id)})">add task</a>${dashData?.can_approve?` · <a class="mini" onclick="okrForm('KeyResult',${jsArg(kr.id)})">edit</a>`:''}${(dashData?.serving?.[kr.id]||[]).length?`<br><small class="muted">${dashData.serving[kr.id].length} task(s): ${dashData.serving[kr.id].map(id=>`<a class="mini" onclick="openTask(${jsArg(id)})">${esc(id)}</a>`).join(' ')}</small>`:''}</div></div>`}
function workList(title,items){return `<div class="tile worklist"><b>${esc(title)}</b> <span class="chip">${items.length}</span>${items.length?`<ul>${items.map(t=>`<li onclick="openTask(${jsArg(t.id)})">${t.overdue?'⚠ ':''}${esc(t.title)}<br><small class="muted">${esc(t.assignee||'unassigned')}${t.due_date?' · due '+esc(t.due_date):''}</small></li>`).join('')}</ul>`:`<div class="empty">nothing</div>`}</div>`}
async function loadDashboard(){const el=document.getElementById('dashboard-view');const want=dashTenant||localStorage.getItem('dashTenant')||'';try{const d=await api('/api/dashboard'+(want?'?tenant='+encodeURIComponent(want):''));if(d.available===false){el.innerHTML='<h2>Dashboard</h2><p class="empty">The team records are not set up on this instance yet.</p>';return}dashTenant=d.tenant;localStorage.setItem('dashTenant',d.tenant);renderDashboard(d)}catch(e){if(want){dashTenant=null;localStorage.removeItem('dashTenant');return loadDashboard()}el.innerHTML=`<p class="empty">${esc(e.message)}</p>`}}
function renderDashboard(d){const el=document.getElementById('dashboard-view');const server=(currentUser?.matrix_id||'').split(':').slice(1).join(':');const room=server?`https://${location.hostname}:8443/#/room/%23${encodeURIComponent(d.tenant)}:${encodeURIComponent(server)}`:'';
const sel=`<select onchange="dashTenant=this.value;loadDashboard()">${d.tenants.map(t=>`<option value="${esc(t)}" ${t===d.tenant?'selected':''}>${esc(t)}</option>`).join('')}</select>`;
dashData=d;let h=`<div class="top"><h2 style="margin:0">Team ${esc(d.tenant)}</h2>${sel}${room?`<a href="${room}" target="_blank" class="chip">open #${esc(d.tenant)} in chat</a>`:''}${d.can_approve?`<span style="flex:1"></span><button class="small" onclick="okrForm('Objective')">New objective</button><button class="small" onclick="okrForm('KPI')">New KPI</button>`:''}</div>`;
if(d.rollup){h+=`<h2>All teams</h2><div class="tiles">${d.rollup.map(r=>{const kr=r.key_results||{},kp=r.kpis||{};const bad=(kr.off_track||0)+(kp.crit||0),warn=(kr.at_risk||0)+(kp.warn||0);return `<div class="tile ${bad?'crit':warn?'warn':'ok'}" style="cursor:pointer" onclick="dashTenant=${jsArg(r.tenant)};loadDashboard()"><b>${esc(r.tenant)}</b><div class="sub">${(r.objectives||{}).active||0} active objectives · ${Object.values(kr).reduce((a,b)=>a+b,0)} KRs · ${Object.values(kp).reduce((a,b)=>a+b,0)} KPIs</div><div class="sub">${bad?`<span class="chip crit">${bad} off track</span> `:''}${warn?`<span class="chip warn">${warn} at risk</span> `:''}${r.board.open} open · ${r.board.review} in review · ${r.board.blocked} blocked</div></div>`}).join('')}</div>`}
h+=`<h2>Objectives</h2>`;const objs=d.objectives||[];h+=objs.length?objs.map(o=>`<div class="obj"><h3>${esc(o.title)} <span class="chip ${esc(o.status||'')}">${esc(o.status||'draft')}</span> <small class="muted">${esc(o.period||'')}${o.owner?' · owner '+esc(o.owner):''}</small>${d.can_approve?` <a class="mini" onclick="okrForm('KeyResult',null,${jsArg(o.id)})">add key result</a> · <a class="mini" onclick="okrForm('Objective',${jsArg(o.id)})">edit</a>`:''}</h3>${o.description?`<div class="muted" style="font-size:13px;margin-bottom:6px">${esc(o.description)}</div>`:''}${(o.key_results||[]).map(krHtml).join('')||'<div class="empty">no key results yet</div>'}</div>`).join(''):'<div class="empty">No objectives for this team yet.</div>';
h+=`<h2>KPIs</h2>`;const kpis=d.kpis||[];h+=kpis.length?`<div class="tiles">${kpis.map(k=>`<div class="tile ${esc(k.status||'unknown')}"><b>${esc(k.title)}</b><div class="big">${fmtNum(k.current)} <small class="sub">${esc(k.unit||'')}</small></div><div class="sub">target ${fmtNum(k.target)}${k.direction==='down'?' or less':''} · <span class="chip ${esc(k.status||'unknown')}">${esc(k.status||'unknown')}</span></div>${spark(k.measurements||[])}<div class="sub">${k.last_measured?'measured '+fmtDate(k.last_measured):'not measured yet'}${k.measure?' · '+esc(k.measure):''}</div><div class="sub"><a class="mini" onclick="checkinForm(${jsArg(k.id)},${jsArg(k.title)},${jsArg(k.unit||'')})">check in</a>${d.can_approve?` · <a class="mini" onclick="okrForm('KPI',${jsArg(k.id)})">edit</a>`:''}</div></div>`).join('')}</div>`:'<div class="empty">No KPIs for this team yet.</div>';
const w=d.work||{};h+=`<h2>Work</h2><div class="worklists">${d.can_approve?workList('Awaiting my approval',w.awaiting_my_approval||[]):workList('In review',w.in_review||[])}${workList('Blocked',w.blocked||[])}${workList('In progress',w.in_progress||[])}${workList('Done this week',w.recently_done||[])}</div>`;
h+=`<h2>Weekly reviews</h2>`;const rs=d.reviews||[];h+=rs.length?rs.map(r=>`<div class="review"><b>${esc(r.week)}</b> <span class="chip approved">approved</span>\n${esc(r.summary||'')}</div>`).join(''):'<div class="empty">No approved review yet.</div>';
el.innerHTML=h}
const OKR_FIELDS={Objective:[['title','Title','text'],['period','Period (e.g. 2026-Q4)','text'],['owner','Owner','text'],['description','Description','textarea'],['status','Status','select',['draft','active','closed']]],
KeyResult:[['title','Title','text'],['kind','Kind','select',['number','percent','count','bool']],['unit','Unit','text'],['start','Start value','number'],['target','Target','number'],['direction','Direction','select',['up','down']],['cadence','Check-in cadence','select',['weekly','monthly']],['measure','Measured by','select',['manual','board','records','agent']],['metric','Metric (board.*, hr.*; see Help)','text']],
KPI:[['title','Title','text'],['unit','Unit','text'],['target','Target','number'],['warn','Warn beyond','number'],['crit','Critical beyond','number'],['direction','Direction','select',['up','down']],['measure','Measured by','select',['manual','board','records','agent']],['metric','Metric (board.*, hr.*; see Help)','text'],['schedule','Schedule','select',['hourly','daily','weekly']]]};
function findOkr(type,id){const d=dashData||{};if(type==='KPI')return (d.kpis||[]).find(k=>k.id===id);if(type==='Objective')return (d.objectives||[]).find(o=>o.id===id);for(const o of d.objectives||[]){const kr=(o.key_results||[]).find(k=>k.id===id);if(kr)return kr}return null}
function okrForm(type,id=null,objectiveId=null){const cur=id?findOkr(type,id)||{}:{};const fields=OKR_FIELDS[type].map(([k,label,kind,opts])=>{const v=cur[k]??'';if(kind==='select')return `<label>${esc(label)}<select id="okr-${k}">${opts.map(o=>`<option value="${o}" ${v===o?'selected':''}>${o}</option>`).join('')}</select></label>`;if(kind==='textarea')return `<label>${esc(label)}<textarea id="okr-${k}" rows="3">${esc(v)}</textarea></label>`;return `<label>${esc(label)}<input id="okr-${k}" type="${kind}" ${kind==='number'?'step="any"':''} value="${esc(v)}"></label>`}).join('');
document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${id?'Edit':'New'} ${type==='KeyResult'?'key result':type==='KPI'?'KPI':'objective'}</h2><button onclick="closeModal()">✕</button></div><div class="form">${fields}</div><p class="muted" id="okr-status"></p><div class="row"><button onclick="saveOkr(${jsArg(type)},${jsArg(id||'')},${jsArg(objectiveId||'')})">Save</button>${id?`<button class="danger" onclick="deleteOkr(${jsArg(id)},this)">Delete</button>`:''}<button onclick="closeModal()">Cancel</button></div>`;document.getElementById('modal-back').style.display='flex'}
async function saveOkr(type,id,objectiveId){const status=document.getElementById('okr-status');const data={};for(const [k,,kind] of OKR_FIELDS[type]){const el=document.getElementById('okr-'+k);let v=el.value;if(kind==='number'){if(v==='')continue;v=Number(v);if(Number.isNaN(v)){status.textContent='Not a number: '+k;return}}else{v=v.trim();if(v===''){if(id)data[k]=null;continue}}data[k]=v}
if(!id&&type!=='KeyResult')data.tenant=dashData.tenant;if(!data.title){status.textContent='A title is needed';return}
const body={type,data};if(id)body.id=id;if(objectiveId)body.objective_id=objectiveId;status.textContent='Saving…';try{await api('/api/okr/objects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});closeModal();notify('Saved. Measured values follow within the hour.',true);loadDashboard()}catch(e){status.textContent=e.message}}
async function deleteOkr(id,btn){if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent='Really delete? (also its key results and history)';return}const status=document.getElementById('okr-status');status.textContent='Deleting…';try{await api(`/api/okr/objects/${encodeURIComponent(id)}/delete`,{method:'POST'});closeModal();notify('Deleted',true);loadDashboard()}catch(e){status.textContent=e.message}}
function checkinForm(id,title,unit){document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>Check in: ${esc(title)}</h2><button onclick="closeModal()">✕</button></div><div class="form"><label>Current value ${unit?'('+esc(unit)+')':''}<input id="ci-value" type="number" step="any" autofocus></label><label>Note (what moved it, optional)<textarea id="ci-note" rows="2"></textarea></label></div><p class="muted" id="ci-status">Recorded under your name with today's date.</p><div class="row"><button onclick="submitCheckin(${jsArg(id)})">Record</button><button onclick="closeModal()">Cancel</button></div>`;document.getElementById('modal-back').style.display='flex';setTimeout(()=>document.getElementById('ci-value')?.focus(),50)}
async function submitCheckin(id){const status=document.getElementById('ci-status');const v=Number(document.getElementById('ci-value').value);if(document.getElementById('ci-value').value===''||Number.isNaN(v)){status.textContent='Enter a number';return}status.textContent='Recording…';try{await api('/api/okr/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_id:id,value:v,note:document.getElementById('ci-note').value.trim()})});closeModal();notify('Check-in recorded',true);loadDashboard()}catch(e){status.textContent=e.message}}
let peopleCache=null;
async function loadPeople(){try{peopleCache=await api('/api/people');renderPeople()}catch(e){document.getElementById('people-view').innerHTML=`<h2>People</h2><p class="red">${esc(e.message)}</p>`}}
function renderPeople(){const d=peopleCache;const rows=d.people.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.matrix_id)}</small></td><td>${esc(p.tenants.join(', '))}</td><td>${esc(p.approve.join(', ')||'—')}</td><td>${p.editable?`<button class="secondary" onclick="openPerson(${jsArg(p.localpart)})">Change</button>`:`<span class="muted">${p.role==='owner'?'owner':'—'}</span>`}</td></tr>`).join('');document.getElementById('people-view').innerHTML=`<h2>People</h2><p class="muted">Each person gets a Matrix account on ${esc(d.server)}, is invited to the rooms of their teams only, can talk to those teams' bots, and sees the same teams here.</p><button onclick="openPerson(null)">Add person</button><table class="people"><thead><tr><th>Person</th><th>Teams</th><th>May approve</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted">Nobody yet.</td></tr>'}</tbody></table>`}
function teamChecks(p){const d=peopleCache;return `<table class="people"><thead><tr><th>Team</th><th>Member</th><th>May approve</th></tr></thead><tbody>${d.tenants.map(t=>`<tr><td>${esc(t)}</td><td><input type="checkbox" class="pt-read" value="${esc(t)}" ${p&&p.tenants.includes(t)?'checked':''}></td><td>${d.approvable.includes(t)?`<input type="checkbox" class="pt-approve" value="${esc(t)}" ${p&&p.approve.includes(t)?'checked':''}>`:'<span class="muted">—</span>'}</td></tr>`).join('')}</tbody></table>`}
function openPerson(localpart){const p=localpart?peopleCache.people.find(x=>x.localpart===localpart):null;document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${p?'Change '+esc(p.name):'Add person'}</h2><button class="secondary" onclick="closeModal()">Close</button></div>${p?`<p class="muted">${esc(p.matrix_id)}</p>`:`<label>Name<input id="pp-name" placeholder="First Last"></label><label>User name (Matrix ID @name:${esc(peopleCache.server)})<input id="pp-local" placeholder="first.last" autocapitalize="off"></label>`}${teamChecks(p)}<div class="actions"><button onclick="savePerson(${jsArg(localpart||'')})">${p?'Save':'Create account'}</button>${p?`<button class="reject" onclick="confirmRemovePerson(${jsArg(p.localpart)})">Remove person</button>`:''}</div><p class="muted">Takes up to a minute: the bots restart to pick up the change.</p><div class="status" id="pp-status"></div>`;document.getElementById('modal-back').style.display='flex'}
function checkedValues(cls){return [...document.querySelectorAll('.'+cls)].filter(x=>x.checked).map(x=>x.value)}
async function savePerson(localpart){const status=document.getElementById('pp-status');const tenants=checkedValues('pt-read');const approve=checkedValues('pt-approve');if(!tenants.length){status.textContent='Tick at least one team.';return}if(approve.some(t=>!tenants.includes(t))){status.textContent='Approval only for teams the person is a member of.';return}status.textContent='Working…';for(const b of document.querySelectorAll('#modal button'))b.disabled=true;try{if(localpart){await api('/api/people/'+encodeURIComponent(localpart),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenants,approve})});closeModal();notify('Saved.',true)}else{const name=document.getElementById('pp-name').value.trim();const lp=document.getElementById('pp-local').value.trim().toLowerCase();const r=await api('/api/people',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({localpart:lp,name,tenants,approve})});showCreated(name,r)}await loadPeople()}catch(e){status.textContent=e.message;for(const b of document.querySelectorAll('#modal button'))b.disabled=false}}
function showCreated(name,r){const base=location.hostname;const web=`https://${base}:8443`;const pw=r.initial_password||'';window.createdText=`Matrix ID: ${r.matrix_id}\nInitial password: ${pw}\nMatrix app homeserver: ${base}\nWeb: ${web}\nPortal: ${location.origin}\n(Tailscale must be on. Change the password in the Portal: Profile › Change password.)`;const row=(label,value)=>`<p>${label}<br><span class="copyrow"><code>${esc(value)}</code><button class="secondary" onclick="copyText(${jsArg(value)},this)">Copy</button></span></p>`;document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>Account created</h2><button class="secondary" onclick="closeModal()">Done</button></div><p>Give ${esc(name)} these details in person or by phone, not by e-mail. The password is shown only now.</p>${row('Matrix ID',r.matrix_id)}${pw?row('Initial password',pw):'<p>Initial password<br><code>(see the operator)</code></p>'}${row('Matrix app: homeserver',base)}${row('Element Web',web)}${row('Team Portal',location.origin)}<button onclick="copyText(window.createdText,this)">Copy all</button><p class="muted">Tailscale must be on. They change the password in the Portal (Profile › Change password) and accept the room invites.</p>`}
async function copyText(value,btn){let ok=false;try{await navigator.clipboard.writeText(value);ok=true}catch(e){const t=document.createElement('textarea');t.value=value;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{ok=document.execCommand('copy')}catch(e2){}t.remove()}const old=btn.textContent;btn.textContent=ok?'Copied':'Copy failed';setTimeout(()=>btn.textContent=old,1500)}
function confirmRemovePerson(localpart){const p=peopleCache.people.find(x=>x.localpart===localpart);document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>Remove ${esc(p.name)}?</h2><button class="secondary" onclick="closeModal()">Cancel</button></div><p>${esc(p.matrix_id)} loses access to the Portal and every room, and the account is deactivated. The user name cannot be used again.</p><button class="reject" onclick="removePerson(${jsArg(localpart)})">Remove</button><div class="status" id="pp-status"></div>`}
async function removePerson(localpart){const status=document.getElementById('pp-status');status.textContent='Working…';for(const b of document.querySelectorAll('#modal button'))b.disabled=true;try{await api('/api/people/'+encodeURIComponent(localpart),{method:'DELETE'});closeModal();notify('Removed.',true);await loadPeople()}catch(e){status.textContent=e.message;for(const b of document.querySelectorAll('#modal button'))b.disabled=false}}
async function loadProfile(){try{currentUser=await api('/api/profile');const u=currentUser;document.getElementById('profile-view').innerHTML=u.telegram_user_id===null?`<h2>Profile</h2><p><b>${esc(u.name)}</b> · ${esc(u.role)}</p><p>Matrix ID <code>${esc(u.matrix_id)}</code></p><p>Teams: ${esc((u.tenants||[]).join(', '))}${u.can_rollup?' · all-tenant rollup':''}</p><p>May approve: ${esc((u.can_approve_artifacts||[]).join(', ')||'—')}</p><h3>Change password</h3><p class="muted">Your Matrix password (Matrix apps, Element Web). Your signed-in apps stay signed in.</p><label>Current password<input id="pw-current" type="password" autocomplete="current-password"></label><label>New password (at least 12 characters)<input id="pw-new" type="password" autocomplete="new-password"></label><label>Repeat new password<input id="pw-repeat" type="password" autocomplete="new-password"></label><button onclick="changePassword()">Change password</button><div class="status" id="pw-status"></div><hr><button class="secondary" onclick="logout()">Log out</button>`:`<h2>Profile</h2><p><b>${esc(u.name)}</b> · ${esc(u.role)}</p><label>Telegram username<input id="profile-username" value="${esc(u.telegram_username||'')}" placeholder="@username"></label><button onclick="saveProfile()">Save username</button><p>Telegram user ID <code>${esc(u.telegram_user_id)}</code> <span class="muted">(read-only; changing account identity requires admin verification)</span></p><p>Chat ID <code>${esc(u.telegram_chat_id)}</code></p><p>Teams: ${esc((u.tenants||[]).join(', '))}${u.can_rollup?' · all-tenant rollup':''}</p><div class="status" id="profile-status"></div><button class="secondary" onclick="logout()">Log out</button>`}catch(e){}}
async function changePassword(){const status=document.getElementById('pw-status');const current=document.getElementById('pw-current').value,next=document.getElementById('pw-new').value,again=document.getElementById('pw-repeat').value;if(!current||!next){status.textContent='Fill in both passwords.';return}if(next.length<12){status.textContent='Use at least 12 characters.';return}if(next!==again){status.textContent='The new passwords do not match.';return}status.textContent='Working…';try{await api('/api/profile/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:current,new_password:next})});for(const id of ['pw-current','pw-new','pw-repeat'])document.getElementById(id).value='';status.textContent='';notify('Password changed. Use it next time you sign in to a Matrix app.',true)}catch(e){status.textContent=e.message}}
async function saveProfile(){const status=document.getElementById('profile-status');try{const r=await api('/api/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_username:document.getElementById('profile-username').value})});status.textContent='Username updated. Use the new handle on your next login.';currentUser.telegram_username=r.telegram_username}catch(e){status.textContent=e.message}}
(async()=>{try{currentUser=await api('/api/profile');document.getElementById('nav-people').classList.toggle('hidden',!currentUser.can_manage_people);document.getElementById('login-screen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');showView('dashboard')}catch(e){showLogin()}})();
</script></body></html>
