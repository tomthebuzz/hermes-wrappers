<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FutureTree Team Portal</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #0f1115; color: #e6e6e6; }
  header { padding: 1rem 1.5rem; background: #171a21; border-bottom: 1px solid #2a2e37; }
  main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }
  .card { background: #171a21; border: 1px solid #2a2e37; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
  .card.overdue { border-color: #c0392b; }
  .tag { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 4px; background: #2a2e37; font-size: 0.75rem; margin-right: 0.4rem; }
  .overdue-badge { color: #ff6b6b; font-weight: 600; }
  button { background: #3a7afe; color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; margin-right: 0.4rem; }
  button.reject { background: #c0392b; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 0.5rem; border-radius: 4px; border: 1px solid #2a2e37; background: #0f1115; color: #e6e6e6; margin-bottom: 0.5rem; }
  nav a { color: #9ab8ff; margin-right: 1rem; cursor: pointer; }
  #login-screen { max-width: 400px; margin: 4rem auto; text-align: center; }
</style>
</head>
<body>
<div id="login-screen">
  <h2>FutureTree Team Portal</h2>
  <p>Enter your Telegram numeric user ID — a login link will be sent to you via Telegram.</p>
  <input id="login-id" type="number" placeholder="Telegram user ID">
  <button onclick="requestLogin()">Send login link</button>
  <p id="login-status"></p>
</div>

<div id="app" style="display:none;">
  <header>
    <nav>
      <a onclick="showView('board')">Kanban</a>
      <a onclick="showView('artifacts')">Artifact Review</a>
    </nav>
  </header>
  <main>
    <div id="board-view"></div>
    <div id="artifacts-view" style="display:none;"></div>
  </main>
</div>

<script>
// NOTE: no build step on purpose — Phase 1/2 skeleton, not a production
// frontend. Fine for an internal 10-12 person tool; revisit if this grows.

async function api(path, opts) {
  const res = await fetch(path, { credentials: 'include', ...opts });
  if (res.status === 401) { showLogin(); throw new Error('not logged in'); }
  return res;
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('app').style.display = 'none';
}

async function requestLogin() {
  const id = document.getElementById('login-id').value;
  const res = await fetch('/login', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({telegram_user_id: parseInt(id)})
  });
  document.getElementById('login-status').textContent =
    res.ok ? 'Check Telegram for your login link.' : 'Could not send login link.';
}

function showView(name) {
  document.getElementById('board-view').style.display = name === 'board' ? 'block' : 'none';
  document.getElementById('artifacts-view').style.display = name === 'artifacts' ? 'block' : 'none';
  if (name === 'board') loadBoard(); else loadArtifacts();
}

async function loadBoard() {
  const el = document.getElementById('board-view');
  try {
    const res = await api('/api/board');
    const data = await res.json();
    el.innerHTML = '<h3>Kanban (' + data.tenants.join(', ') + ')</h3>' +
      data.tasks.map(t => `
        <div class="card ${t.overdue ? 'overdue' : ''}">
          <span class="tag">${t.tenant}</span>
          <span class="tag">${t.status}</span>
          ${t.overdue ? '<span class="overdue-badge">OVERDUE</span>' : ''}
          <h4>${t.title}</h4>
          <p>${t.body || ''}</p>
        </div>`).join('');
  } catch (e) { /* redirected to login */ }
}

async function loadArtifacts() {
  const el = document.getElementById('artifacts-view');
  try {
    const res = await api('/api/artifacts');
    const data = await res.json();
    el.innerHTML = '<h3>Artifact Review Queue</h3>' +
      data.tasks.map(t => {
        const overdue = t.sla_seconds_remaining !== null && t.sla_seconds_remaining < 0;
        const remainingHrs = t.sla_seconds_remaining !== null
          ? (t.sla_seconds_remaining / 3600).toFixed(1) : 'n/a';
        return `
        <div class="card ${overdue ? 'overdue' : ''}" id="artifact-${t.id}">
          <span class="tag">${t.tenant}</span>
          ${overdue ? '<span class="overdue-badge">SLA MISSED</span>' : `<span class="tag">${remainingHrs}h left</span>`}
          <h4>${t.title}</h4>
          <p>${t.body || ''}</p>
          ${t.can_review ? `
            <button onclick="review('${t.id}', true)">Approve</button>
            <button class="reject" onclick="review('${t.id}', false)">Reject</button>
          ` : '<p><em>You can view this but not approve/reject it.</em></p>'}
          <textarea id="comment-${t.id}" placeholder="Add a comment..."></textarea>
          <button onclick="comment('${t.id}')">Comment</button>
        </div>`;
      }).join('') || '<p>Nothing awaiting review.</p>';
  } catch (e) { /* redirected to login */ }
}

async function review(taskId, approve) {
  await api('/api/artifacts/review', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({task_id: taskId, approve})
  });
  loadArtifacts();
}

async function comment(taskId) {
  const text = document.getElementById('comment-' + taskId).value;
  if (!text) return;
  await api(`/api/tasks/${taskId}/comments`, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})
  });
  loadArtifacts();
}

// On load: if we already have a valid session cookie, /api/board will
// succeed and we skip the login screen.
(async () => {
  try {
    await api('/api/board');
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    showView('board');
  } catch (e) { showLogin(); }
})();
</script>
</body>
</html>
