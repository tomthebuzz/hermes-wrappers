<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Portal</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#202530;--line:#303643;--text:#e7eaf0;--muted:#aab2c0;--blue:#3a7afe;--red:#c0392b;--gold:#d6a94a}
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:3;background:var(--panel);padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:18px}a,.link{color:#9ab8ff;cursor:pointer;text-decoration:none}main{padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.toolbar select,.toolbar input,input,textarea{background:#10131a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px}.toolbar select{min-width:140px}button{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:8px 12px;cursor:pointer}button.secondary{background:#424957}button.reject{background:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}.board-shell{overflow:auto}.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:12px;align-items:start}.column{min-height:60vh;background:#12151d;border:1px solid var(--line);border-radius:9px}.column.over{outline:2px dashed var(--blue)}.colhead{padding:11px;background:var(--panel2);border-radius:9px 9px 0 0;display:flex;justify-content:space-between;font-weight:700}.colbody{padding:9px;min-height:55vh}.card{background:var(--panel);border:1px solid var(--line);padding:11px;border-radius:8px;margin-bottom:9px;cursor:pointer}.card:hover{border-color:#6587cb}.card.dragging{opacity:.4}.card.overdue{border-color:var(--red)}.tag{display:inline-block;background:#303643;border-radius:4px;padding:2px 6px;font-size:11px;margin:0 4px 4px 0}.red{color:#ff7373}.muted{color:var(--muted)}.priority{color:#ffd479;font-weight:700}.modal-back{position:fixed;inset:0;background:#000a;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal input,.modal textarea{width:100%;margin:5px 0 12px}.modal textarea{min-height:120px}.actions{display:flex;gap:8px;flex-wrap:wrap}.profile{max-width:600px}.status{margin:10px 0}.hidden{display:none!important}#login-screen{max-width:430px;margin:12vh auto;text-align:center;padding:20px}#login-screen input{width:100%;margin:8px 0}.artifact{cursor:pointer}
</style></head>
<body>
<div id="login-screen"><h2>Team Portal</h2><p>Sign in with your Telegram @username.</p><input id="login-id" placeholder="@username"><button onclick="requestLogin()">Send login link</button><p id="login-status" class="status"></p></div>
<div id="app" class="hidden">
<header><nav><a onclick="showView('board')">Kanban</a><a onclick="showView('artifacts')">Artifacts</a></nav><nav><a onclick="showView('profile')">Profile</a><a onclick="logout()">Log out</a></nav></header>
<main><section id="board-view"></section><section id="artifacts-view" class="hidden"></section><section id="profile-view" class="hidden profile"></section></main></div>
<div id="modal-back" class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
const COLS=[['triage','Triage'],['todo','Todo'],['ready','Ready'],['running','In Progress'],['review','Review'],['blocked','Blocked'],['done','Done'],['archived','Archived']];
let currentUser=null, tasksCache=[], filters={tenant:'',assignee:'',due:'',priority:''}, activeTask=null;
const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opts={}){const r=await fetch(path,{credentials:'include',...opts});if(r.status===401){showLogin();throw Error('Not logged in')}const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||`Request failed (${r.status})`);return j}
function showLogin(){document.getElementById('login-screen').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
async function requestLogin(){const status=document.getElementById('login-status');try{await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('login-id').value.trim()})});status.textContent='Login link sent. Check Telegram.';status.className='status'}catch(e){status.textContent=e.message;status.className='status red'}}
async function logout(){await fetch('/logout',{method:'POST',credentials:'include'});showLogin()}
function showView(view){for(const id of ['board-view','artifacts-view','profile-view'])document.getElementById(id).classList.toggle('hidden',id!==`${view}-view`);if(view==='board')loadBoard();if(view==='artifacts')loadArtifacts();if(view==='profile')loadProfile()}
function dueBucket(date){if(!date)return 'none';const d=new Date(date),now=new Date();if(Number.isNaN(d.valueOf()))return 'none';if(d<now)return 'overdue';const start=new Date(now);start.setHours(0,0,0,0);const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);const end=new Date(start);end.setDate(start.getDate()+7);if(d<end)return 'week';const monthEnd=new Date(now.getFullYear(),now.getMonth()+1,1);if(d<monthEnd)return 'month';return 'later'}
function matchFilters(t){if(filters.tenant&&t.tenant!==filters.tenant)return false;if(filters.assignee==='mine'&&t.assignee!==currentUser?.name&&t.assignee!==currentUser?.telegram_username)return false;if(filters.assignee&&filters.assignee!=='mine'&&t.assignee!==filters.assignee)return false;if(filters.due&&dueBucket(t.due_date)!==filters.due)return false;if(filters.priority!==''&&String(t.priority??0)!==filters.priority)return false;return true}
function toolbar(data){const tenants=data.tenants||[];const assignees=[...new Set(data.tasks.map(t=>t.assignee).filter(Boolean))].sort();return `<div class="toolbar"><select onchange="filters.tenant=this.value;renderBoard()"><option value="">All teams</option>${tenants.map(x=>`<option ${filters.tenant===x?'selected':''} value="${esc(x)}">${esc(x)}</option>`).join('')}</select><select onchange="filters.assignee=this.value;renderBoard()"><option value="">All users</option><option value="mine" ${filters.assignee==='mine'?'selected':''}>My items</option>${assignees.map(x=>`<option value="${esc(x)}" ${filters.assignee===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="filters.due=this.value;renderBoard()"><option value="">Any due date</option><option value="overdue" ${filters.due==='overdue'?'selected':''}>Overdue</option><option value="week" ${filters.due==='week'?'selected':''}>Due this week</option><option value="month" ${filters.due==='month'?'selected':''}>Due this month</option><option value="later" ${filters.due==='later'?'selected':''}>Later</option><option value="none" ${filters.due==='none'?'selected':''}>No due date</option></select><select onchange="filters.priority=this.value;renderBoard()"><option value="">Any priority</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${filters.priority===String(n)?'selected':''}>Priority ${n}</option>`).join('')}</select><button onclick="clearFilters()" class="secondary">Clear</button></div>`}
function clearFilters(){filters={tenant:'',assignee:'',due:'',priority:''};renderBoard()}
async function loadBoard(){try{const d=await api('/api/board');tasksCache=d.tasks;renderBoard(d)}catch(e){}}
function renderBoard(data=null){const el=document.getElementById('board-view');if(data){tasksCache=data.tasks;window.boardTenants=data.tenants}const tenants=window.boardTenants||[...new Set(tasksCache.map(t=>t.tenant).filter(Boolean))];const filtered=tasksCache.filter(matchFilters);const groups=Object.fromEntries(COLS.map(([k])=>[k,[]]));const other=[];for(const t of filtered){(groups[t.status]||other).push(t)}const d={tenants,tasks:tasksCache};el.innerHTML=`<h2>Kanban board</h2>${toolbar(d)}<div class="board-shell"><div class="board">${COLS.map(([key,label])=>{const dragAttrs=key==='triage'?'':'ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropTask(event,\''+key+'\')"';return `<div class="column" data-status="${key}" ${dragAttrs}><div class="colhead">${label}<span>${groups[key].length}</span></div><div class="colbody">${groups[key].map(cardHtml).join('')||'<div class="muted">No cards</div>'}</div></div>`}).join('')}${other.length?`<div class="column"><div class="colhead">Other <span>${other.length}</span></div><div class="colbody">${other.map(cardHtml).join('')}</div></div>`:''}</div></div>`}
function cardHtml(t){return `<article class="card ${t.overdue?'overdue':''}" draggable="true" ondragstart="dragStart(event,'${esc(t.id)}')" ondragend="this.classList.remove('dragging')" onclick="openTask('${esc(t.id)}')"><span class="tag">${esc(t.tenant||'')}</span><span class="tag">${esc(t.assignee||'Unassigned')}</span><span class="priority">P${esc(t.priority??0)}</span>${t.overdue?'<span class="red"> OVERDUE</span>':''}<h3>${esc(t.title)}</h3><div class="muted">${esc((t.body||'').slice(0,130))}</div><small class="muted">${esc(t.id)}${t.due_date?' · Due '+esc(new Date(t.due_date).toLocaleDateString()):''}</small></article>`}
function dragStart(e,id){e.dataTransfer.setData('text/task-id',id);e.currentTarget.classList.add('dragging')}
function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('over')};function leaveDrop(e){e.currentTarget.classList.remove('over')}
async function dropTask(e,status){e.preventDefault();e.currentTarget.classList.remove('over');const id=e.dataTransfer.getData('text/task-id');if(!id)return;try{await api(`/api/tasks/${encodeURIComponent(id)}/transition`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await loadBoard()}catch(err){alert(err.message);loadBoard()}}
async function openTask(id){try{activeTask=await api('/api/tasks/'+encodeURIComponent(id));renderTaskModal(activeTask)}catch(e){alert(e.message)}}
function renderTaskModal(t){const canEdit=(currentUser?.tenants||[]).includes(t.tenant)||currentUser?.can_rollup;const comments=(t.comments||[]).map(c=>`<p><b>${esc(c.author)}</b> · ${esc(c.text||c.body)}</p>`).join('')||'<p class="muted">No comments.</p>';document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>Task details</h2><button class="secondary" onclick="closeModal()">Close</button></div><label>Title<input id="edit-title" value="${esc(t.title)}" ${canEdit?'':'disabled'}></label><label>Details<textarea id="edit-body" ${canEdit?'':'disabled'}>${esc(t.body||'')}</textarea></label><div class="toolbar"><label>Priority<select id="edit-priority" ${canEdit?'':'disabled'}>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${Number(t.priority||0)===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Assignee<input id="edit-assignee" value="${esc(t.assignee||'')}" ${canEdit?'':'disabled'}></label><span class="tag">${esc(t.tenant)} / ${esc(t.status)}</span></div><div class="actions">${canEdit?'<button onclick="saveTask()">Save changes</button>':''}<button class="secondary" onclick="claimTask('${esc(t.id)}')">Claim</button>${t.status==='review'&&t.can_review?`<button onclick="reviewArtifact('${esc(t.id)}',true)">Approve</button><button class="reject" onclick="reviewArtifact('${esc(t.id)}',false)">Request changes</button>`:''}</div><p class="muted">Due: ${esc(t.due_date||'not set')} · Review SLA: ${esc(t.sla_deadline||'not applicable')}</p><hr><h3>Comments</h3><div>${comments}</div><textarea id="new-comment" placeholder="Add a comment"></textarea><button onclick="addComment('${esc(t.id)}')">Add comment</button><div class="status" id="modal-status"></div>`;document.getElementById('modal-back').style.display='flex'}
function closeModal(){document.getElementById('modal-back').style.display='none';activeTask=null}
async function saveTask(){const t=activeTask;try{await api('/api/tasks/'+encodeURIComponent(t.id),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('edit-title').value,body:document.getElementById('edit-body').value,priority:Number(document.getElementById('edit-priority').value),assignee:document.getElementById('edit-assignee').value.trim()||null})});await openTask(t.id);loadBoard()}catch(e){alert(e.message)}}
async function claimTask(id){try{await api(`/api/tasks/${encodeURIComponent(id)}/claim`,{method:'POST'});await openTask(id);loadBoard()}catch(e){alert(e.message)}}
async function addComment(id){const text=document.getElementById('new-comment').value.trim();if(!text)return;try{await api(`/api/tasks/${encodeURIComponent(id)}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});await openTask(id);loadBoard()}catch(e){alert(e.message)}}
async function loadArtifacts(){try{const d=await api('/api/artifacts');const cards=d.tasks.map(t=>{const actions=t.can_review?`<div class="actions" onclick="event.stopPropagation()"><button onclick="reviewArtifact('${esc(t.id)}',true)">Approve</button><button class="reject" onclick="reviewArtifact('${esc(t.id)}',false)">Request changes</button></div>`:'<span class="muted">View only</span>';const sla=t.sla_seconds_remaining===null?'No deadline':(t.sla_seconds_remaining/3600).toFixed(1)+'h left';return `<article class="card artifact ${t.sla_seconds_remaining!==null&&t.sla_seconds_remaining<0?'overdue':''}" onclick="openTask('${esc(t.id)}')"><span class="tag">${esc(t.tenant)}</span><span class="tag">${sla}</span><h3>${esc(t.title)}</h3><p>${esc(t.body||'')}</p>${actions}</article>`}).join('');document.getElementById('artifacts-view').innerHTML=`<h2>Artifact review</h2><p class="muted">Open a card for details, comments, and review actions.</p>${cards||'<p>No artifacts awaiting review.</p>'}`}catch(e){}}
async function reviewArtifact(id,approve){const note=prompt(approve?'Approval note (optional)':'Changes requested');if(note===null)return;try{await api('/api/artifacts/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,approve,note})});await loadArtifacts()}catch(e){alert(e.message)}}
async function loadProfile(){try{currentUser=await api('/api/profile');const u=currentUser;document.getElementById('profile-view').innerHTML=`<h2>Profile</h2><p><b>${esc(u.name)}</b> · ${esc(u.role)}</p><label>Telegram username<input id="profile-username" value="${esc(u.telegram_username||'')}" placeholder="@username"></label><button onclick="saveProfile()">Save username</button><p>Telegram user ID <code>${esc(u.telegram_user_id)}</code> <span class="muted">(read-only; changing account identity requires admin verification)</span></p><p>Chat ID <code>${esc(u.telegram_chat_id)}</code></p><p>Teams: ${esc((u.tenants||[]).join(', '))}${u.can_rollup?' · all-tenant rollup':''}</p><div class="status" id="profile-status"></div><button class="secondary" onclick="logout()">Log out</button>`}catch(e){}}
async function saveProfile(){const status=document.getElementById('profile-status');try{const r=await api('/api/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_username:document.getElementById('profile-username').value})});status.textContent='Username updated. Use the new handle on your next login.';currentUser.telegram_username=r.telegram_username}catch(e){status.textContent=e.message}}
(async()=>{try{currentUser=await api('/api/profile');document.getElementById('login-screen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');showView('board')}catch(e){showLogin()}})();
</script></body></html>
