<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Portal</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#202530;--line:#303643;--text:#e7eaf0;--muted:#aab2c0;--blue:#3a7afe;--red:#c0392b;--gold:#d6a94a}
*{box-sizing:border-box}body{font:14px system-ui,sans-serif;margin:0;background:var(--bg);color:var(--text)}header{position:sticky;top:0;z-index:3;background:var(--panel);padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}nav{display:flex;gap:18px;align-items:center}a,.link{color:#9ab8ff;cursor:pointer;text-decoration:none}main{padding:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.toolbar select,.toolbar input,input,textarea{background:#10131a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:9px}.toolbar select{min-width:140px}button{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:8px 12px;cursor:pointer}button.secondary{background:#424957}button.reject{background:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}.board-shell{overflow:auto}.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:12px;align-items:start}.column{min-height:60vh;background:#12151d;border:1px solid var(--line);border-radius:9px}.column.over{outline:2px dashed var(--blue)}.colhead{padding:11px;background:var(--panel2);border-radius:9px 9px 0 0;display:flex;justify-content:space-between;font-weight:700}.column-tools{display:flex;align-items:center;gap:8px}.add-btn{border-radius:50%;padding:0;width:24px;height:24px;line-height:22px;font-size:18px;background:#3a7afe}.colbody{padding:9px;min-height:55vh}.card{background:var(--panel);border:1px solid var(--line);padding:11px;border-radius:8px;margin-bottom:9px;cursor:pointer}.card:hover{border-color:#6587cb}.card.dragging{opacity:.4}.card.overdue{border-color:var(--red)}.tag{display:inline-block;background:#303643;border-radius:4px;padding:2px 6px;font-size:11px;margin:0 4px 4px 0}.red{color:#ff7373}.muted{color:var(--muted)}.priority{color:#ffd479;font-weight:700}.modal-back{position:fixed;inset:0;background:#000a;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modal label{display:block;margin:6px 0}.modal input,.modal textarea{width:100%;margin:5px 0 12px}.modal select{margin:4px 0}.modal textarea{min-height:120px}.actions{display:flex;gap:8px;flex-wrap:wrap}.profile{max-width:600px}.status{margin:10px 0}.hidden{display:none!important}#login-screen{max-width:430px;margin:12vh auto;text-align:center;padding:20px}#login-screen input{width:100%;margin:8px 0}.artifact{cursor:pointer}.upload-label{display:inline-block;background:#424957;color:#fff;padding:8px 12px;border-radius:5px;cursor:pointer}.file-input{display:none}
.toast{position:fixed;right:16px;bottom:16px;z-index:20;max-width:min(420px,calc(100% - 32px));background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;display:none}.toast.ok{border-left-color:var(--blue)}
table.people{width:100%;border-collapse:collapse;margin:14px 0}table.people th,table.people td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}table.people input[type=checkbox]{width:18px;height:18px}.profile label{display:block}.profile input{display:block;width:100%;margin:5px 0 12px}.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.copyrow code{word-break:break-all}
.dash{padding:16px;max-width:1200px;margin:0 auto}.dash h2{margin:18px 0 8px;font-size:17px}.dash .top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.dash select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}.tile .big{font-size:26px;font-weight:600;line-height:1.1}.tile .sub{color:var(--muted);font-size:12px}.tile.ok{border-left:4px solid #2fbf71}.tile.warn{border-left:4px solid #e0a52a}.tile.crit,.tile.off_track{border-left:4px solid #e0443a}.tile.at_risk{border-left:4px solid #e0a52a}.tile.on_track,.tile.done{border-left:4px solid #2fbf71}.tile.unknown{border-left:4px solid var(--line)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--panel2);color:var(--muted)}.chip.ok,.chip.on_track,.chip.done,.chip.approved{background:#1f4d35;color:#9be2b8}.chip.warn,.chip.at_risk{background:#4d3d12;color:#f0cf7a}.chip.crit,.chip.off_track{background:#4d1f1c;color:#f0a39c}
.obj{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}.obj h3{margin:0 0 6px;font-size:15px}.kr{display:grid;grid-template-columns:1fr 150px 140px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.kr .bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}.kr .bar i{display:block;height:100%;background:var(--blue)}.kr small{color:var(--muted)}
.worklists{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.worklist ul{list-style:none;margin:6px 0 0;padding:0}.worklist li{padding:6px 0;border-top:1px solid var(--line);cursor:pointer}.worklist li:hover{color:var(--blue)}.spark{display:block;width:100%;height:36px;margin-top:6px}
button.danger{background:#7a2a24;color:#fff}ul.plain{list-style:none;padding:0;margin:6px 0}ul.plain li{padding:4px 0}.mini{color:var(--blue);cursor:pointer;font-size:12px}.mini:hover{text-decoration:underline}button.small{padding:5px 10px;font-size:12px}.form label{display:block;margin:8px 0;font-size:13px;color:var(--muted)}.form input,.form select,.form textarea{display:block;width:100%;margin-top:3px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:inherit}.row{display:flex;gap:8px;margin-top:10px}
.review{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;white-space:pre-wrap}.empty{color:var(--muted);padding:8px 0}
.chips{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap;background:#10131a;border:1px solid var(--line);border-radius:6px;padding:3px 4px;min-height:36px}.chips select{border:0;background:transparent;padding:4px;min-width:auto;color:var(--muted)}.chip.pick{background:#2b3a5e;color:#dfe8ff;font-size:12px;padding:3px 6px 3px 8px}.chip.pick a{color:#9ab8ff;margin-left:5px;font-weight:700}.toolbar input[type=date]{padding:7px}
.lanehead{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin:8px 0 5px;padding-left:6px;border-left:3px solid var(--line)}.lanehead:first-child{margin-top:0}.lanedot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);vertical-align:middle;margin-right:4px}
table.files{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px}table.files th,table.files td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}table.files th{color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}table.files td a{cursor:pointer}
select.lang{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px}#login-screen select.lang{width:auto;margin-top:14px}
</style></head>
<body>
<div id="login-screen"><h2>Team Portal</h2><p data-i18n="login.intro"></p><input id="login-id" placeholder="@name" autocapitalize="off"><button onclick="requestLogin()" data-i18n="login.send"></button><p id="login-status" class="status"></p><p class="muted"><span data-i18n="login.new_here"></span> <a href="/help" target="_blank" data-i18n="login.read_guide"></a>.</p><select class="lang" onchange="setLang(this.value)"></select></div>
<div id="app" class="hidden">
<header><nav><a onclick="showView('dashboard')" data-i18n="nav.dashboard"></a><a onclick="showView('board')" data-i18n="nav.board"></a><a onclick="showView('artifacts')" data-i18n="nav.artifacts"></a></nav><nav><a href="/help" target="_blank" data-i18n="nav.help"></a><a id="nav-people" class="hidden" onclick="showView('people')" data-i18n="nav.people"></a><a onclick="showView('profile')" data-i18n="nav.profile"></a><a onclick="logout()" data-i18n="nav.logout"></a><select class="lang" onchange="setLang(this.value)" title="Language"></select></nav></header>
<main><section id="dashboard-view" class="hidden dash"></section><section id="board-view"></section><section id="artifacts-view" class="hidden"></section><section id="people-view" class="hidden profile"></section><section id="profile-view" class="hidden profile"></section></main></div>
<div id="toast" class="toast" role="status" onclick="this.style.display='none'"></div>
<div id="modal-back" class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<script>
// --- i18n: English is the source (en.json), other languages override it; same catalogs as the server (app/i18n.py).
const LANGS={en:'English',de:'Deutsch'};
const I18N={lang:'en',locale:'en',en:{},cur:{}};
function t(key,params){let s;if(params&&params.count!==undefined){const form=new Intl.PluralRules(I18N.locale).select(params.count)==='one'?'_one':'_other';s=I18N.cur[key+form]??I18N.en[key+form]}if(s===undefined)s=I18N.cur[key]??I18N.en[key];if(s===undefined){console.warn('i18n: missing',key);return key}return params?s.replace(/\{\{(\w+)\}\}/g,(m,n)=>params[n]===undefined?m:params[n]):s}
function cookieLang(){const m=document.cookie.match(/(?:^|; )lang=([A-Za-z-]+)/);return m?m[1]:''}
function pickLang(preferred){for(const c of [cookieLang(),preferred,navigator.language]){const s=String(c||'').toLowerCase().split('-')[0];if(LANGS[s])return s}return 'en'}
async function loadLang(lang){I18N.lang=lang;I18N.locale=String(navigator.language||'').toLowerCase().startsWith(lang)?navigator.language:lang;if(!Object.keys(I18N.en).length)I18N.en=await (await fetch('/static/i18n/en.json')).json();I18N.cur=lang==='en'?I18N.en:await fetch('/static/i18n/'+lang+'.json').then(r=>r.json()).catch(()=>({}));document.documentElement.lang=lang;applyStatic()}
function applyStatic(){for(const el of document.querySelectorAll('[data-i18n]'))el.textContent=t(el.dataset.i18n);for(const sel of document.querySelectorAll('select.lang'))sel.innerHTML=Object.entries(LANGS).map(([k,v])=>`<option value="${k}" ${k===I18N.lang?'selected':''}>${v}</option>`).join('')}
function setLang(lang){if(!LANGS[lang])return;document.cookie=`lang=${lang}; max-age=31536000; path=/; samesite=lax${location.protocol==='https:'?'; secure':''}`;location.reload()}
const COLS=[['triage','board.col.triage'],['todo','board.col.todo'],['ready','board.col.ready'],['running','board.col.running'],['review','board.col.review'],['blocked','board.col.blocked'],['done','board.col.done'],['archived','board.col.archived']];
let currentUser=null, tasksCache=[], activeTask=null, boardLanes={};
// Filter objects are looked up by name (window[store]) from the chip pickers, so they are `var`, not `let`.
var filters={tenant:[],assignee:[],lane:[],due:[],priority:[]};
// Multi-select filters: picked values show as chips, the select adds one more. `store` names a global filter object.
function chipSelect(store,key,label,options,rerender){const sel=window[store][key]||[];const chips=sel.map(v=>{const o=options.find(x=>String(x[0])===String(v));return `<span class="chip pick">${esc(o?o[1]:v)}<a onclick="pickRemove(${jsArg(store)},${jsArg(key)},${jsArg(String(v))},${jsArg(rerender)})" title="${t('common.remove')}">×</a></span>`}).join('');const rest=options.filter(o=>!sel.map(String).includes(String(o[0])));return `<span class="chips"><span>${chips}</span><select onchange="pickAdd(${jsArg(store)},${jsArg(key)},this.value,${jsArg(rerender)})"><option value="">${esc(sel.length?'+ '+label:label)}</option>${rest.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join('')}</select></span>`}
function pickAdd(store,key,value,rerender){if(value==='')return;const f=window[store];if(!f[key].map(String).includes(value))f[key]=[...f[key],value];window[rerender]()}
function pickRemove(store,key,value,rerender){const f=window[store];f[key]=f[key].filter(v=>String(v)!==value);window[rerender]()}
function anyOf(list,value){return !list.length||list.map(String).includes(String(value))}
let toastTimer=null;function notify(msg,ok=false){const el=document.getElementById('toast');el.textContent=msg;el.classList.toggle('ok',ok);el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',8000)}
let assigneesCache=null;async function loadAssignees(){if(assigneesCache===null){try{assigneesCache=(await api('/api/assignees')).assignees||[]}catch(e){assigneesCache=[]}}return assigneesCache}
function assigneeOptions(selected){const names=[...assigneesCache||[]];if(selected&&!names.includes(selected))names.push(selected);return `<option value="">${t('task.unassigned_option')}</option>`+names.map(n=>`<option value="${esc(n)}" ${n===selected?'selected':''}>${esc(n)}</option>`).join('')}
function defaultAssignee(tenant){return (assigneesCache||[]).includes(tenant)?tenant:''}
const esc=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
// A JS string literal for an inline handler: the browser HTML-decodes the attribute
// before running it, so esc() alone would let a quote break out of '...'.
const jsArg=v=>esc(JSON.stringify(String(v??'')));
async function api(path,opts={}){const r=await fetch(path,{credentials:'include',...opts});if(r.status===401){showLogin();throw Error(t('err.not_logged_in'))}const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||t('err.request_failed',{status:r.status}));if(j&&j.notice)notify(j.notice,true);return j}
function showLogin(){document.getElementById('login-screen').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
async function requestLogin(){const status=document.getElementById('login-status');try{await api('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:document.getElementById('login-id').value.trim()})});status.textContent=t('login.sent');status.className='status'}catch(e){status.textContent=e.message;status.className='status red'}}
async function logout(){await fetch('/logout',{method:'POST',credentials:'include'});showLogin()}
function showView(view){for(const id of ['dashboard-view','board-view','artifacts-view','people-view','profile-view'])document.getElementById(id).classList.toggle('hidden',id!==`${view}-view`);if(view==='dashboard')loadDashboard();if(view==='board')loadBoard();if(view==='artifacts')loadArtifacts();if(view==='people')loadPeople();if(view==='profile')loadProfile()}
function dueBucket(date){if(!date)return 'none';const d=new Date(date),now=new Date();if(Number.isNaN(d.valueOf()))return 'none';if(d<now)return 'overdue';const start=new Date(now);start.setHours(0,0,0,0);const day=(start.getDay()+6)%7;start.setDate(start.getDate()-day);const end=new Date(start);end.setDate(start.getDate()+7);if(d<end)return 'week';const monthEnd=new Date(now.getFullYear(),now.getMonth()+1,1);if(d<monthEnd)return 'month';return 'later'}
function matchFilters(t){if(!anyOf(filters.tenant,t.tenant))return false;if(filters.assignee.length){const mine=filters.assignee.includes('mine')&&(t.assignee===currentUser?.name||t.assignee===currentUser?.telegram_username);if(!mine&&!filters.assignee.includes(t.assignee))return false}if(!anyOf(filters.lane,t.lane||'none'))return false;if(!anyOf(filters.due,dueBucket(t.due_date)))return false;if(!anyOf(filters.priority,t.priority??0))return false;return true}
function laneOptions(tenants){const out=[];for(const tn of tenants)for(const l of boardLanes[tn]||[])out.push([l.id,tenants.length>1?`${l.name} (${tn})`:l.name]);if(out.length)out.push(['none',t('board.no_lane')]);return out}
function toolbar(data){const tenants=data.tenants||[];const assignees=[...new Set(data.tasks.map(x=>x.assignee).filter(Boolean))].sort();const visible=filters.tenant.length?tenants.filter(x=>filters.tenant.includes(x)):tenants;const lanes=laneOptions(visible);const any=Object.values(filters).some(v=>v.length);return `<div class="toolbar">${chipSelect('filters','tenant',t('filt.all_teams'),tenants.map(x=>[x,x]),'renderBoard')}${chipSelect('filters','assignee',t('filt.all_users'),[['mine',t('filt.my_items')],...assignees.map(x=>[x,x])],'renderBoard')}${lanes.length?chipSelect('filters','lane',t('filt.all_lanes'),lanes,'renderBoard'):''}${chipSelect('filters','due',t('filt.any_due'),[['overdue',t('filt.overdue')],['week',t('filt.due_week')],['month',t('filt.due_month')],['later',t('filt.later')],['none',t('filt.no_due')]],'renderBoard')}${chipSelect('filters','priority',t('filt.any_priority'),[0,1,2,3,4,5].map(n=>[String(n),t('filt.priority_n',{n})]),'renderBoard')}${any?`<button onclick="clearFilters()" class="secondary">${t('common.clear')}</button>`:''}</div>`}
function clearFilters(){filters={tenant:[],assignee:[],lane:[],due:[],priority:[]};renderBoard()}
async function openNewTask(status,tenant=null,keyResult=null,lane=null){await loadAssignees();if(!window.boardTenants){try{const d=await api('/api/board');window.boardTenants=d.tenants;boardLanes=d.lanes||{}}catch(e){}}const tenants=window.boardTenants||[];if(!tenants.length){notify(t('task.no_teams'));return}const selected=tenant||(filters.tenant.length===1?filters.tenant[0]:tenants[0]);document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${t('task.new_title',{status:esc(status)})}</h2><button class="secondary" onclick="closeModal()">${t('common.close')}</button></div><label>${t('task.title')}<input id="new-title" placeholder="${t('task.title_ph')}" autofocus></label><label>${t('task.team')}<select id="new-tenant" onchange="document.getElementById('new-assignee').innerHTML=assigneeOptions(defaultAssignee(this.value))">${tenants.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label>${t('task.details')}<textarea id="new-body" placeholder="${t('task.details_ph')}"></textarea></label><label>${t('task.priority')}<select id="new-priority">${[0,1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></label><label>${t('task.assignee_profile')}<select id="new-assignee">${assigneeOptions(defaultAssignee(selected))}</select></label><label>${t('task.serves_kr')}<select id="new-kr"><option value="">${t('common.none')}</option></select></label><label id="new-lane-label" class="hidden">${t('task.lane')}<select id="new-lane"><option value="">${t('common.none')}</option></select></label>${status==='todo'?`<p class="muted">${t('task.todo_note')}</p>`:''}<button onclick="createNewTask('${status}')">${t('task.create')}</button><div class="status" id="new-task-status"></div>`;document.getElementById('modal-back').style.display='flex';loadNewTaskKrs(selected,keyResult,lane);document.getElementById('new-tenant').addEventListener('change',e=>loadNewTaskKrs(e.target.value,null,null))}
async function loadNewTaskKrs(tenant,selected,lane){try{const [k,l]=await Promise.all([api('/api/okr/key-results?tenant='+encodeURIComponent(tenant)),api('/api/lanes?tenant='+encodeURIComponent(tenant))]);const sel=document.getElementById('new-kr');if(sel)sel.innerHTML=`<option value="">${t('common.none')}</option>`+k.key_results.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.title)} (${esc(x.objective)})</option>`).join('');const ls=document.getElementById('new-lane');if(ls){const pick=lane||(filters.lane.length===1&&filters.lane[0]!=='none'?filters.lane[0]:'');ls.innerHTML=`<option value="">${t('common.none')}</option>`+l.lanes.map(x=>`<option value="${esc(x.id)}" ${x.id===pick?'selected':''}>${esc(x.name)}</option>`).join('');document.getElementById('new-lane-label').classList.toggle('hidden',!l.lanes.length)}}catch(e){}}
async function createNewTask(status){const title=document.getElementById('new-title').value.trim();if(!title){document.getElementById('new-task-status').textContent=t('task.enter_title');return}try{await api('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,tenant:document.getElementById('new-tenant').value,body:document.getElementById('new-body').value,assignee:document.getElementById('new-assignee').value||null,status,priority:Number(document.getElementById('new-priority').value),key_result:document.getElementById('new-kr')?.value||null,lane:document.getElementById('new-lane')?.value||null})});closeModal();if(document.getElementById('dashboard-view').classList.contains('hidden'))await loadBoard();else loadDashboard()}catch(e){document.getElementById('new-task-status').textContent=e.message}}
async function loadBoard(){try{const d=await api('/api/board');tasksCache=d.tasks;renderBoard(d)}catch(e){if(e.message!==t('err.not_logged_in'))notify(t('board.error',{error:e.message}))}}
function renderBoard(data=null){const el=document.getElementById('board-view');if(data){tasksCache=data.tasks;window.boardTenants=data.tenants;boardLanes=data.lanes||{}}const tenants=window.boardTenants||[...new Set(tasksCache.map(x=>x.tenant).filter(Boolean))];const filtered=tasksCache.filter(matchFilters);const groups=Object.fromEntries(COLS.map(([k])=>[k,[]]));const other=[];for(const x of filtered){(groups[x.status]||other).push(x)}const d={tenants,tasks:tasksCache};el.innerHTML=`<h2>${t('board.title')}</h2>${toolbar(d)}<div class="board-shell"><div class="board">${COLS.map(([key,labelKey])=>{const label=t(labelKey);const dragAttrs=key==='triage'?'':'ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="dropTask(event,\''+key+'\')"';return `<div class="column" data-status="${key}" ${dragAttrs}><div class="colhead">${label}<span class="column-tools"><span>${groups[key].length}</span><button class="add-btn" title="${t('board.add_in',{col:label})}" onclick="event.stopPropagation();openNewTask('${key}')">+</button></span></div><div class="colbody">${lanedCards(groups[key],tenants)||`<div class="muted">${t('board.no_cards')}</div>`}</div></div>`}).join('')}${other.length?`<div class="column"><div class="colhead">${t('board.col.other')} <span>${other.length}</span></div><div class="colbody">${other.map(cardHtml).join('')}</div></div>`:''}</div></div>`}
// Cards of one column grouped by swimlane (team order, then lane order); cards without a lane last. No lanes defined: a plain list.
function lanedCards(cards,tenants){const lanes=[];for(const tn of tenants)for(const l of boardLanes[tn]||[])lanes.push({...l,tenant:tn});if(!lanes.length)return cards.map(cardHtml).join('');const by={};for(const c of cards)(by[c.lane||'none']=by[c.lane||'none']||[]).push(c);let h='';for(const l of lanes){const cs=by[l.id];if(!cs)continue;h+=`<div class="lanehead" style="border-left-color:${esc(l.color||'var(--line)')}">${esc(l.name)}${tenants.length>1?` <span class="muted">· ${esc(l.tenant)}</span>`:''} <span class="muted">${cs.length}</span></div>${cs.map(cardHtml).join('')}`}if(by.none)h+=`<div class="lanehead">${t('board.no_lane')} <span class="muted">${by.none.length}</span></div>${by.none.map(cardHtml).join('')}`;return h}
function cardHtml(x){return `<article class="card ${x.overdue?'overdue':''}" draggable="true" ondragstart="dragStart(event,${jsArg(x.id)})" ondragend="this.classList.remove('dragging')" onclick="openTask(${jsArg(x.id)})"><span class="tag">${esc(x.tenant||'')}</span>${x.lane_name?`<span class="tag" title="${t('task.lane')}"><i class="lanedot" style="background:${esc(x.lane_color||'var(--line)')}"></i>${esc(x.lane_name)}</span>`:''}<span class="tag">${esc(x.assignee||t('task.unassigned'))}</span><span class="priority">P${esc(x.priority??0)}</span>${x.overdue?`<span class="red"> ${t('task.overdue')}</span>`:''}<h3>${esc(x.title)}</h3><div class="muted">${esc((x.body||'').slice(0,130))}</div><small class="muted">${esc(x.id)}${x.due_date?' · '+t('task.due_short',{date:esc(new Date(x.due_date).toLocaleDateString(I18N.locale))}):''}</small></article>`}
function dragStart(e,id){e.dataTransfer.setData('text/task-id',id);e.currentTarget.classList.add('dragging')}
function allowDrop(e){e.preventDefault();e.currentTarget.classList.add('over')};function leaveDrop(e){e.currentTarget.classList.remove('over')}
async function dropTask(e,status){e.preventDefault();e.currentTarget.classList.remove('over');const id=e.dataTransfer.getData('text/task-id');if(!id)return;try{const result=await api(`/api/tasks/${encodeURIComponent(id)}/transition`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await loadBoard();if(status==='todo'&&result.detail?.includes('Todo'))notify(result.detail)}catch(err){notify(err.message);loadBoard()}}

function renderTaskModal(x){const canEdit=(currentUser?.tenants||[]).includes(x.tenant)||currentUser?.can_rollup;const comments=(x.comments||[]).map(c=>`<p><b>${esc(c.author)}</b> · ${esc(c.text||c.body)}</p>`).join('')||`<p class="muted">${t('task.no_comments')}</p>`;const attachments=(x.attachments||[]).map(a=>`<li><a href="/api/attachments/${a.id}" target="_blank">${t('task.preview_file',{name:esc(a.filename)})}</a> <a href="/api/attachments/${a.id}?download=1">${t('common.download')}</a> <span class="muted">(${Math.ceil((a.size||0)/1024)} KB)</span></li>`).join('')||`<li class="muted">${t('task.no_files')}</li>`;document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${t('task.details_title')}</h2><button class="secondary" onclick="closeModal()">${t('common.close')}</button></div><label>${t('task.title')}<input id="edit-title" value="${esc(x.title)}" ${canEdit?'':'disabled'}></label><label>${t('task.details')}<textarea id="edit-body" ${canEdit?'':'disabled'}>${esc(x.body||'')}</textarea></label><div class="toolbar"><label>${t('task.priority')}<select id="edit-priority" ${canEdit?'':'disabled'}>${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${Number(x.priority||0)===n?'selected':''}>${n}</option>`).join('')}</select></label><label>${t('task.assignee')}<select id="edit-assignee" ${canEdit?'':'disabled'}>${assigneeOptions(x.assignee||'')}</select></label>${(x.lanes||[]).length?`<label>${t('task.lane')}<select onchange="setLane(${jsArg(x.id)},this.value)" ${canEdit?'':'disabled'}><option value="">${t('common.none')}</option>${x.lanes.map(l=>`<option value="${esc(l.id)}" ${l.id===x.lane?'selected':''}>${esc(l.name)}</option>`).join('')}</select></label>`:''}<span class="tag">${esc(x.tenant)} / ${esc(x.status)}</span></div><div class="actions">${canEdit?`<button onclick="saveTask()">${t('task.save')}</button>`:''}${x.status==='ready'?`<button class="secondary" onclick="claimTask(${jsArg(x.id)})">${t('task.claim')}</button>`:''}${x.status==='review'&&x.can function stakeholdersHtml(x){const me=currentUser?.matrix_id;const rows=(x.stakeholders||[]).map(l=>`<li><span class="chip">${esc(t('sh.role.'+l.role))}</span> ${esc(l.person)}${(l.serves||[]).length?` <small class="muted">· ${t('sh.serves',{krs:l.serves.map(k=>esc(k.title)).join(', ')})}</small>`:''}${(x.can_name_stakeholders||l.matrix_id===me)?` <a class="mini" onclick="removeStakeholder(${jsArg(x.id)},${jsArg(l.id)})">${t('common.remove')}</a>`:''}</li>`).join('')||`<li class="muted">${t('sh.nobody')}</li>`;

async function loadArtifacts(){try{const d=await api('/api/artifacts');const cards=d.tasks.map(x=>{const actions=x.can_review?`<button onclick="reviewArtifact(${jsArg(x.id)},true)">${t('review.approve')}</button><button class="reject" onclick="reviewArtifact(${jsArg(x.id)},false)">${t('review.request_changes')}</button>`:`<span class="muted">${t('art.view_only')}</span>`;const hours=x.sla_seconds_remaining===null?null:(x.sla_seconds_remaining/3600).toFixed(1);const lvl=x.autonomy_level;const sla=hours===null?t('art.no_deadline'):(x.auto_approves?t('art.auto_approves',{hours}):lvl!==null?t('art.needs_decision',{hours}):t('art.hours_left',{hours}));const level=lvl===null?'':`<span class="tag" title="${t('art.level_title')}">${t('art.level',{level:lvl})}</span>`;return `<article class="card artifact ${x.sla_seconds_remaining!==null&&x.sla_seconds_remaining<0?'overdue':''}" onclick="openTask(${jsArg(x.id)})"><span class="tag">${esc(x.tenant)}</span>${level}<span class="tag">${sla}</span><h3>${esc(x.title)}</h3><p>${esc(x.body||'')}</p><div class="actions" onclick="event.stopPropagation()">${actions}<label class="upload-label">${t('common.upload_file')}<input class="file-input" type="file" onchange="uploadTaskAttachment(${jsArg(x.id)},this)"></label></div></article>`}).join('');document.getElementById('artifacts-view').innerHTML=`<h2>${t('art.awaiting')}</h2><p class="muted">${t('art.awaiting_hint')}</p>${cards||`<p>${t('art.none')}</p>`}<h2>${t('art.all')}</h2><p class="muted">${t('art.all_hint')}</p><div id="files"></div>`;await loadFiles()}catch(e){}}
var fileFilters={tenant:[],lane:[],owner:[],reviewer:[],status:[]};let filesCache=[],fileSort={key:'created_at',desc:true},fileDates={from:'',to:''};
async function loadFiles(){try{const d=await api('/api/artifacts/files');filesCache=d.files||[];renderFiles()}catch(e){document.getElementById('files').innerHTML=`<p class="empty">${esc(e.message)}</p>`}}
function fileMatch(f){if(!anyOf(fileFilters.tenant,f.tenant))return false;if(!anyOf(fileFilters.lane,f.lane||'none'))return false;if(!anyOf(fileFilters.owner,f.owner||''))return false;if(fileFilters.reviewer.length&&!f.reviewers.some(r=>fileFilters.reviewer.includes(r)))return false;if(!anyOf(fileFilters.status,f.status))return false;const day=new Date(f.created_at*1000).toISOString().slice(0,10);if(fileDates.from&&day<fileDates.from)return false;if(fileDates.to&&day>fileDates.to)return false;return true}
function sortFiles(key){fileSort=fileSort.key===key?{key,desc:!fileSort.desc}:{key,desc:key==='created_at'};renderFiles()}
function renderFiles(){const el=document.getElementById('files');if(!el)return;const all=filesCache;const opts=k=>[...new Set(all.map(f=>f[k]).filter(Boolean))].sort().map(x=>[x,x]);const lanes=[];const seen=new Set();for(const f of all)if(f.lane&&!seen.has(f.lane)){seen.add(f.lane);lanes.push([f.lane,`${f.lane_name} (${f.tenant})`])}if(all.some(f=>!f.lane))lanes.push(['none',t('board.no_lane')]);const reviewers=[...new Set(all.flatMap(f=>f.reviewers))].sort().map(x=>[x,x]);const rows=all.filter(fileMatch).sort((a,b)=>{const k=fileSort.key;let x=a[k]??'',y=b[k]??'';if(typeof x==='string'){x=x.toLowerCase();y=String(y).toLowerCase()}return (x<y?-1:x>y?1:0)*(fileSort.desc?-1:1)});const th=(k,label)=>`<th onclick="sortFiles(${jsArg(k)})">${esc(label)}${fileSort.key===k?(fileSort.desc?' ▼':' ▲'):''}</th>`;const any=Object.values(fileFilters).some(v=>v.length)||fileDates.from||fileDates.to;
el.innerHTML=`<div class="toolbar">${chipSelect('fileFilters','tenant',t('filt.all_teams'),opts('tenant'),'renderFiles')}${lanes.length?chipSelect('fileFilters','lane',t('filt.all_lanes'),lanes,'renderFiles'):''}${chipSelect('fileFilters','owner',t('filt.any_owner'),opts('owner'),'renderFiles')}${reviewers.length?chipSelect('fileFilters','reviewer',t('filt.any_reviewer'),reviewers,'renderFiles'):''}${chipSelect('fileFilters','status',t('filt.any_status'),opts('status'),'renderFiles')}<label class="muted">${t('filt.from')} <input type="date" value="${fileDates.from}" onchange="fileDates.from=this.value;renderFiles()"></label><label class="muted">${t('filt.to')} <input type="date" value="${fileDates.to}" onchange="fileDates.to=this.value;renderFiles()"></label>${any?`<button class="secondary" onclick="fileFilters={tenant:[],lane:[],owner:[],reviewer:[],status:[]};fileDates={from:'',to:''};renderFiles()">${t('common.clear')}</button>`:''}</div>${rows.length?`<table class="files"><thead><tr>${th('created_at',t('files.date'))}${th('filename',t('files.file'))}${th('task_title',t('files.card'))}${th('tenant',t('files.team'))}${th('lane_name',t('task.lane'))}${th('status',t('files.status'))}${th('owner',t('files.owner'))}<th>${t('files.reviewers')}</th></tr></thead><tbody>${rows.map(f=>`<tr><td>${esc(new Date(f.created_at*1000).toLocaleString(I18N.locale))}</td><td><a href="/api/attachments/${f.id}" target="_blank">${esc(f.filename)}</a> <a class="mini" href="/api/attachments/${f.id}?download=1">${t('common.download').toLowerCase()}</a><br><small class="muted">${Math.ceil((f.size||0)/1024)} KB${f.uploaded_by?' · '+t('files.by',{who:esc(f.uploaded_by)}):''}</small></td><td><a onclick="openTask(${jsArg(f.task_id)})">${esc(f.task_title)}</a><br><small class="muted">${esc(f.task_id)}</small></td><td>${esc(f.tenant)}</td><td>${esc(f.lane_name||'–')}</td><td><span class="chip">${esc(f.status)}</span></td><td>${esc(f.owner||'–')}</td><td>${f.reviewers.map(esc).join(', ')||'–'}</td></tr>`).join('')}</tbody></table><p class="muted">${t('files.count',{n:rows.length,total:all.length})}</p>`:`<p class="empty">${all.length?t('files.no_match'):t('files.none')}</p>`}`}
function reviewArtifact(id,approve){document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${approve?t('review.approve_title'):t('review.request_changes')}</h2><button class="secondary" onclick="closeModal()">${t('common.cancel')}</button></div><label>${approve?t('review.note_label'):t('review.changes_label')}<textarea id="review-note" placeholder="${approve?t('review.note_ph'):t('review.changes_ph')}"></textarea></label><button class="${approve?'':'reject'}" onclick="submitReview(${jsArg(id)},${approve})">${approve?t('review.approve'):t('review.send_back')}</button><div class="status" id="review-status"></div>`;document.getElementById('modal-back').style.display='flex';document.getElementById('review-note').focus()}
async function submitReview(id,approve){const note=document.getElementById('review-note').value.trim();if(!approve&&!note){document.getElementById('review-status').textContent=t('review.describe_changes');return}try{await api('/api/artifacts/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task_id:id,approve,note})});closeModal();if(!document.getElementById('dashboard-view').classList.contains('hidden'))loadDashboard();notify(approve?t('review.approved'):t('review.sent_back'),true);await loadArtifacts();loadBoard()}catch(e){document.getElementById('review-status').textContent=e.message}}
let dashTenant=null;
function spark(ms){const v=ms.map(m=>Number(m.value)).filter(x=>!Number.isNaN(x));if(v.length<2)return '';const w=200,h=36,min=Math.min(...v),max=Math.max(...v),span=max-min||1;const pts=v.map((x,i)=>`${(i/(v.length-1))*w},${h-2-((x-min)/span)*(h-4)}`).join(' ');return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline fill="none" stroke="#3a7afe" stroke-width="1.5" points="${pts}"/></svg>`}
function fmtNum(v){if(v===null||v===undefined||v==='')return '–';const n=Number(v);return Number.isNaN(n)?esc(v):(Math.round(n*100)/100).toLocaleString(I18N.locale)}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso);return Number.isNaN(d.valueOf())?esc(iso):d.toLocaleDateString(I18N.locale)}
let dashData=null;
function krHtml(kr){const start=Number(kr.start??0),target=Number(kr.target),cur=Number(kr.current);let pct=0;if(!Number.isNaN(target)&&!Number.isNaN(cur)){const span=target-start;pct=span===0?100:Math.max(0,Math.min(100,Math.round(((cur-start)/span)*100)))}const last=kr.measurements?.length?kr.measurements[kr.measurements.length-1]:null;const served=dashData?.serving?.[kr.id]||[];return `<div class="kr"><div><b>${esc(kr.title)}</b><br><small>${fmtNum(kr.current)} / ${fmtNum(kr.target)} ${esc(kr.unit||'')}${last?` · ${last.method==='manual'?t('dash.checkin_on',{date:fmtDate(last.at)}):t('dash.measured_on',{date:fmtDate(last.at)})}${last.actor&&last.method==='manual'?' '+t('dash.by',{who:esc(last.actor)}):''}`:' · '+t('dash.no_checkin')}</small></div><div><div class="bar"><i style="width:${pct}%"></i></div><small>${pct}%</small></div><div><span class="chip ${esc(kr.status||'')}">${esc(kr.status?t('status.'+kr.status):t('status.none'))}</span><br><a class="mini" onclick="checkinForm(${jsArg(kr.id)},${jsArg(kr.title)},${jsArg(kr.unit||'')})">${t('dash.check_in')}</a> · <a class="mini" onclick="openNewTask('ready',dashData.tenant,${jsArg(kr.id)})">${t('dash.add_task')}</a>${dashData?.can_approve?` · <a class="mini" onclick="okrForm('KeyResult',${jsArg(kr.id)})">${t('common.edit')}</a>`:''}${served.length?`<br><small class="muted">${t('dash.tasks_count',{count:served.length})}: ${served.map(id=>`<a class="mini" onclick="openTask(${jsArg(id)})">${esc(id)}</a>`).join(' ')}</small>`:''}</div></div>`}
function workList(title,items){return `<div class="tile worklist"><b>${esc(title)}</b> <span class="chip">${items.length}</span>${items.length?`<ul>${items.map(x=>`<li onclick="openTask(${jsArg(x.id)})">${x.overdue?'⚠ ':''}${esc(x.title)}<br><small class="muted">${esc(x.assignee||t('task.unassigned_lc'))}${x.due_date?' · '+t('task.due_short',{date:esc(x.due_date)}):''}</small></li>`).join('')}</ul>`:`<div class="empty">${t('dash.nothing')}</div>`}</div>`}
async function loadDashboard(){const el=document.getElementById('dashboard-view');const want=dashTenant||localStorage.getItem('dashTenant')||'';try{const d=await api('/api/dashboard'+(want?'?tenant='+encodeURIComponent(want):''));if(d.available===false){el.innerHTML=`<h2>${t('nav.dashboard')}</h2><p class="empty">${t('dash.not_set_up')}</p>`;return}dashTenant=d.tenant;localStorage.setItem('dashTenant',d.tenant);renderDashboard(d)}catch(e){if(want){dashTenant=null;localStorage.removeItem('dashTenant');return loadDashboard()}el.innerHTML=`<p class="empty">${esc(e.message)}</p>`}}

const OKR_NAMES={KeyResult:'okr.n.key_result',KPI:'okr.n.kpi',Source:'okr.n.source',Swimlane:'okr.n.lane',Objective:'okr.n.objective'};
const FUNNEL_STAGES=['lead','prospect','needs','offer','client','declined'];
function metricParams(m){const p={};(m||'').split(/\s+/).slice(1).forEach(x=>{const i=x.indexOf('=');if(i>0)p[x.slice(0,i)]=x.slice(i+1)});return [(m||'').split(/\s+/)[0]||'',p]}
function funnelTile(kpis){
  // The sales funnel, drawn from this team's KPIs measured by the engine's sales.* catalogue (sales_seed_kpis.py writes the default set). No KPIs with those metrics: no tile.
  const by={},conv={},drop={},declined=[];
  for(const k of kpis){const [name,p]=metricParams(k.metric);if(name==='sales.funnel'&&p.stage)by[p.stage]=k;else if(name==='sales.conversion'&&p.from&&p.to)conv[p.from+'>'+p.to]=k;else if(name==='sales.dropoff'&&p.stage)drop[p.stage]=k;else if(name==='sales.declined'&&p.reason)declined.push([p.reason,k])}
  const stages=FUNNEL_STAGES.filter(s=>by[s]&&s!=='declined');if(!stages.length)return '';
  const max=Math.max(1,...stages.map(s=>Number(by[s].current)||0));
  let h=`<h2>${t('funnel.title')}</h2><div class="tile" style="max-width:none"><div style="display:flex;gap:6px;align-items:stretch;flex-wrap:wrap">`;
  stages.forEach((s,i)=>{const k=by[s],n=Number(k.current)||0,w=Math.max(8,Math.round(100*n/max));const next=stages[i+1];const c=next?conv[s+'>'+next]:null;const dr=drop[s];
    h+=`<div style="flex:1 1 110px;min-width:110px"><div class="sub"><b>${esc(s)}</b></div><div style="background:var(--accent,#3b82f6);opacity:.85;height:26px;border-radius:4px;width:${w}%;min-width:2.2em;color:#fff;font-weight:600;padding:3px 6px;box-sizing:border-box">${fmtNum(n)}</div><div class="sub">${c?t('funnel.to_next',{pct:fmtNum(c.current),next:esc(next)}):(s==='client'?t('funnel.won'):'')}${dr&&dr.current!=null?`<br>${t('funnel.lost_here',{pct:fmtNum(dr.current)})}`:''}</div></div>`});
  h+=`</div>`;
  if(by.declined)h+=`<div class="sub" style="margin-top:6px">${t('funnel.declined_all_time')}: <b>${fmtNum(by.declined.current)}</b></div>`;
  if(declined.length){declined.sort((a,b)=>(Number(b[1].current)||0)-(Number(a[1].current)||0));h+=`<table class="files" style="margin-top:8px"><tr><th>${t('funnel.decline_reason')}</th><th>${t('funnel.deals_window')}</th></tr>${declined.map(([r,k])=>`<tr><td>${esc(k.title.replace(/^Declined:\s*/i,'')||r)}</td><td>${fmtNum(k.current)}</td></tr>`).join('')}</table>`}
  h+=`<div class="sub">${t('funnel.footnote')}</div></div>`;
  return h}
function findOkr(type,id){const d=dashData||{};if(type==='KPI')return (d.kpis||[]).find(k=>k.id===id);if(type==='Source')return (d.sources||[]).find(k=>k.id===id);if(type==='Swimlane')return (d.lanes||[]).find(k=>k.id===id);if(type==='Objective')return (d.objectives||[]).find(o=>o.id===id);for(const o of d.objectives||[]){const kr=(o.key_results||[]).find(k=>k.id===id);if(kr)return kr}return null}
function okrForm(type,id=null,objectiveId=null){const cur=id?findOkr(type,id)||{}:{};const fields=OKR_FIELDS[type].map(([k,labelKey,kind,opts])=>{const v=cur[k]??'';const label=t(labelKey);if(kind==='select')return `<label>${label}<select id="okr-${k}">${opts.map(o=>`<option value="${o}" ${String(v)===o?'selected':''}>${o}</option>`).join('')}</select></label>`;if(kind==='source')return `<label>${label}<select id="okr-${k}"><option value="">${t('common.none')}</option>${(dashData?.sources||[]).map(x=>`<option value="${esc(x.id)}" ${v===x.id?'selected':''}>${esc(x.name)} (${esc(x.kind)})</option>`).join('')}</select></label>`;if(kind==='objective'||kind==='kpi')return `<label>${label}<select id="okr-${k}"><option value="">${t('common.none')}</option>${((kind==='objective'?dashData?.objectives:dashData?.kpis)||[]).map(x=>`<option value="${esc(x.id)}" ${v===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label>`;if(kind==='textarea')return `<label>${label}<textarea id="okr-${k}" rows="3">${esc(v)}</textarea></label>`;return `<label>${label}<input id="okr-${k}" type="${kind}" ${kind==='number'?'step="any"':''} value="${esc(v)}"></label>`}).join('');
document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${t(id?'okr.edit_x':'okr.new_x',{what:t(OKR_NAMES[type])})}</h2><button onclick="closeModal()">✕</button></div><div class="form">${fields}</div><p class="muted" id="okr-status"></p><div class="row"><button onclick="saveOkr(${jsArg(type)},${jsArg(id||'')},${jsArg(objectiveId||'')})">${t('common.save')}</button>${id?`<button class="danger" onclick="deleteOkr(${jsArg(id)},this)">${t('common.delete')}</button>`:''}<button onclick="closeModal()">${t('common.cancel')}</button></div>`;document.getElementById('modal-back').style.display='flex'}
async function saveOkr(type,id,objectiveId){const status=document.getElementById('okr-status');const data={};for(const [k,,kind] of OKR_FIELDS[type]){const el=document.getElementById('okr-'+k);let v=el.value;if(kind==='number'){if(v==='')continue;v=Number(v);if(Number.isNaN(v)){status.textContent=t('okr.not_a_number',{field:k});return}}else{v=v.trim();if(v===''){if(id)data[k]=null;continue}if(k==='enabled')v=(v==='true')}data[k]=v}
if(!id&&type!=='KeyResult')data.tenant=dashData.tenant;if(type==='Source'||type==='Swimlane'){if(!data.name){status.textContent=t('okr.name_needed');return}}else if(!data.title){status.textContent=t('okr.title_needed');return}
const body={type,data};if(id)body.id=id;if(objectiveId)body.objective_id=objectiveId;status.textContent=t('common.saving');try{await api('/api/okr/objects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});closeModal();notify(t('okr.saved'),true);loadDashboard()}catch(e){status.textContent=e.message}}
async function deleteOkr(id,btn){if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent=t('okr.really_delete');return}const status=document.getElementById('okr-status');status.textContent=t('common.deleting');try{await api(`/api/okr/objects/${encodeURIComponent(id)}/delete`,{method:'POST'});closeModal();notify(t('common.deleted'),true);loadDashboard()}catch(e){status.textContent=e.message}}
function moveForm(type,id,title){const to=dashData?.movable_to||[];document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${t('okr.move_x',{what:esc(t(OKR_NAMES[type])),title:esc(title)})}</h2><button onclick="closeModal()">✕</button></div><div class="form"><label>${t('okr.to_team')}<select id="mv-tenant">${to.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label></div><p class="muted" id="mv-status">${type==='Objective'?t('okr.move_objective_note'):type==='KPI'?t('okr.move_kpi_note'):''}</p><div class="row"><button onclick="submitMove(${jsArg(id)})">${t('dash.move_btn')}</button><button onclick="closeModal()">${t('common.cancel')}</button></div>`;document.getElementById('modal-back').style.display='flex'}
async function submitMove(id){const status=document.getElementById('mv-status');const tenant=document.getElementById('mv-tenant').value;status.textContent=t('okr.moving');try{const r=await api(`/api/okr/objects/${encodeURIComponent(id)}/move`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenant})});closeModal();const m=r.object?.moved||{};notify(t('okr.moved',{team:tenant})+(m.kpis?.length?' '+t('okr.with_kpis',{count:m.kpis.length}):''),true);dashTenant=tenant;loadDashboard()}catch(e){status.textContent=e.message}}
function checkinForm(id,title,unit){document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${t('checkin.title',{title:esc(title)})}</h2><button onclick="closeModal()">✕</button></div><div class="form"><label>${t('checkin.value')} ${unit?'('+esc(unit)+')':''}<input id="ci-value" type="number" step="any" autofocus></label><label>${t('checkin.note')}<textarea id="ci-note" rows="2"></textarea></label></div><p class="muted" id="ci-status">${t('checkin.recorded_as')}</p><div class="row"><button onclick="submitCheckin(${jsArg(id)})">${t('checkin.record')}</button><button onclick="closeModal()">${t('common.cancel')}</button></div>`;document.getElementById('modal-back').style.display='flex';setTimeout(()=>document.getElementById('ci-value')?.focus(),50)}
async function submitCheckin(id){const status=document.getElementById('ci-status');const v=Number(document.getElementById('ci-value').value);if(document.getElementById('ci-value').value===''||Number.isNaN(v)){status.textContent=t('checkin.enter_number');return}status.textContent=t('checkin.recording');try{await api('/api/okr/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_id:id,value:v,note:document.getElementById('ci-note').value.trim()})});closeModal();notify(t('checkin.recorded'),true);loadDashboard()}catch(e){status.textContent=e.message}}

async function loadPeople(){try{peopleCache=await api('/api/people');renderPeople()}catch(e){document.getElementById('people-view').innerHTML=`<h2>${t('nav.people')}</h2><p class="red">${esc(e.message)}</p>`}}
function langName(code){return code?(LANGS[code]||code):t('people.lang_browser')}
function renderPeople(){const d=peopleCache;const rows=d.people.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small class="muted">${esc(p.matrix_id)}</small></td><td>${esc(p.tenants.join(', '))}</td><td>${esc(p.approve.join(', ')||'—')}</td><td>${esc(langName(p.language))}</td><td>${p.editable?`<button class="secondary" onclick="openPerson(${jsArg(p.localpart)})">${t('people.change')}</button>`:`<span class="muted">${p.role==='owner'?t('people.owner'):'—'}</span>`}</td></tr>`).join('');document.getElementById('people-view').innerHTML=`<h2>${t('nav.people')}</h2><p class="muted">${t('people.intro',{server:esc(d.server)})}</p><button onclick="openPerson(null)">${t('people.add')}</button><table class="people"><thead><tr><th>${t('people.person')}</th><th>${t('people.teams')}</th><th>${t('people.may_approve')}</th><th>${t('people.language')}</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="5" class="muted">${t('people.nobody')}</td></tr>`}</tbody></table>`}

function openPerson(localpart){const p=localpart?peopleCache.people.find(x=>x.localpart===localpart):null;document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${p?t('people.change_x',{name:esc(p.name)}):t('people.add')}</h2><button class="secondary" onclick="closeModal()">${t('common.close')}</button></div>${p?`<p class="muted">${esc(p.matrix_id)}</p>`:`<label>${t('people.name')}<input id="pp-name" placeholder="${t('people.name_ph')}"></label><label>${t('people.username',{server:esc(peopleCache.server)})}<input id="pp-local" placeholder="first.last" autocapitalize="off"></label>`}${teamChecks(p)}<label>${t('people.language')} ${langSelect('pp-lang',p?p.language:'')}</label><div class="actions"><button onclick="savePerson(${jsArg(localpart||'')})">${p?t('common.save'):t('people.create_account')}</button>${p?`<button class="reject" onclick="confirmRemovePerson(${jsArg(p.localpart)})">${t('people.remove')}</button>`:''}</div><p class="muted">${t('people.takes_minute')}</p><div class="status" id="pp-status"></div>`;document.getElementById('modal-back').style.display='flex'}
function checkedValues(cls){return [...document.querySelectorAll('.'+cls)].filter(x=>x.checked).map(x=>x.value)}
async function savePerson(localpart){const status=document.getElementById('pp-status');const tenants=checkedValues('pt-read');const approve=checkedValues('pt-approve');const language=document.getElementById('pp-lang').value||null;if(!tenants.length){status.textContent=t('people.tick_team');return}if(approve.some(x=>!tenants.includes(x))){status.textContent=t('people.approve_subset');return}status.textContent=t('common.working');for(const b of document.querySelectorAll('#modal button'))b.disabled=true;try{if(localpart){await api('/api/people/'+encodeURIComponent(localpart),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({tenants,approve,language})});closeModal();notify(t('common.saved'),true)}else{const name=document.getElementById('pp-name').value.trim();const lp=document.getElementById('pp-local').value.trim().toLowerCase();const r=await api('/api/people',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({localpart:lp,name,tenants,approve,language})});showCreated(name,r)}await loadPeople()}catch(e){status.textContent=e.message;for(const b of document.querySelectorAll('#modal button'))b.disabled=false}}
function showCreated(name,r){const base=location.hostname;const web=`https://${base}:8443`;const pw=r.initial_password||'';window.createdText=`${t('created.matrix_id')}: ${r.matrix_id}\n${t('created.initial_password')}: ${pw}\n${t('created.homeserver')}: ${base}\n${t('created.web')}: ${web}\n${t('created.portal')}: ${location.origin}\n(${t('created.copy_note')})`;const row=(label,value)=>`<p>${label}<br><span class="copyrow"><code>${esc(value)}</code><button class="secondary" onclick="copyText(${jsArg(value)},this)">${t('common.copy')}</button></span></p>`;document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${t('created.title')}</h2><button class="secondary" onclick="closeModal()">${t('common.done')}</button></div><p>${t('created.hand_over',{name:esc(name)})}</p>${row(t('created.matrix_id'),r.matrix_id)}${pw?row(t('created.initial_password'),pw):`<p>${t('created.initial_password')}<br><code>${t('created.see_operator')}</code></p>`}${row(t('created.homeserver'),base)}${row(t('created.web'),web)}${row(t('created.portal'),location.origin)}<button onclick="copyText(window.createdText,this)">${t('common.copy_all')}</button><p class="muted">${t('created.after_note')}</p>`}
async function copyText(value,btn){let ok=false;try{await navigator.clipboard.writeText(value);ok=true}catch(e){const ta=document.createElement('textarea');ta.value=value;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{ok=document.execCommand('copy')}catch(e2){}ta.remove()}const old=btn.textContent;btn.textContent=ok?t('common.copied'):t('common.copy_failed');setTimeout(()=>btn.textContent=old,1500)}
function confirmRemovePerson(localpart){const p=peopleCache.people.find(x=>x.localpart===localpart);document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>${t('people.remove_x',{name:esc(p.name)})}</h2><button class="secondary" onclick="closeModal()">${t('common.cancel')}</button></div><p>${t('people.remove_note',{id:esc(p.matrix_id)})}</p><button class="reject" onclick="removePerson(${jsArg(localpart)})">${t('common.remove_btn')}</button><div class="status" id="pp-status"></div>`}
async function removePerson(localpart){const status=document.getElementById('pp-status');status.textContent=t('common.working');for(const b of document.querySelectorAll('#modal button'))b.disabled=true;try{await api('/api/people/'+encodeURIComponent(localpart),{method:'DELETE'});closeModal();notify(t('common.removed'),true);await loadPeople()}catch(e){status.textContent=e.message;for(const b of document.querySelectorAll('#modal button'))b.disabled=false}}
async function loadProfile(){try{currentUser=await api('/api/profile');const u=currentUser;const langRow=`<h3>${t('profile.language')}</h3><p class="muted">${t('profile.language_hint')}</p><label>${langSelect('my-lang',u.language||'')}</label><button class="secondary" onclick="saveLanguage()">${t('profile.save_language')}</button><div class="status" id="lang-status"></div>`;document.getElementById('profile-view').innerHTML=u.telegram_user_id===null?`<h2>${t('nav.profile')}</h2><p><b>${esc(u.name)}</b> · ${esc(u.role)}</p><p>${t('profile.matrix_id')} <code>${esc(u.matrix_id)}</code></p><p>${t('profile.teams')}: ${esc((u.tenants||[]).join(', '))}${u.can_rollup?' · '+t('profile.rollup'):''}</p><p>${t('profile.may_approve')}: ${esc((u.can_approve_artifacts||[]).join(', ')||'—')}</p>${langRow}<h3>${t('profile.change_password')}</h3><p class="muted">${t('profile.password_hint')}</p><label>${t('profile.current_password')}<input id="pw-current" type="password" autocomplete="current-password"></label><label>${t('profile.new_password')}<input id="pw-new" type="password" autocomplete="new-password"></label><label>${t('profile.repeat_password')}<input id="pw-repeat" type="password" autocomplete="new-password"></label><button onclick="changePassword()">${t('profile.change_password')}</button><div class="status" id="pw-status"></div><hr><button class="secondary" onclick="logout()">${t('nav.logout')}</button>`:`<h2>${t('nav.profile')}</h2><p><b>${esc(u.name)}</b> · ${esc(u.role)}</p><label>${t('profile.telegram_username')}<input id="profile-username" value="${esc(u.telegram_username||'')}" placeholder="@username"></label><button onclick="saveProfile()">${t('profile.save_username')}</button><p>${t('profile.telegram_user_id')} <code>${esc(u.telegram_user_id)}</code> <span class="muted">${t('profile.telegram_readonly')}</span></p><p>${t('profile.chat_id')} <code>${esc(u.telegram_chat_id)}</code></p><p>${t('profile.teams')}: ${esc((u.tenants||[]).join(', '))}${u.can_rollup?' · '+t('profile.rollup'):''}</p><div class="status" id="profile-status"></div><button class="secondary" onclick="logout()">${t('nav.logout')}</button>`}catch(e){}}
async function saveLanguage(){const status=document.getElementById('lang-status');const language=document.getElementById('my-lang').value||null;status.textContent=t('common.working');try{await api('/api/profile/language',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language})});status.textContent='';if(language&&language!==I18N.lang){setLang(language);return}if(!language)document.cookie='lang=; max-age=0; path=/';notify(t('common.saved'),true)}catch(e){status.textContent=e.message}}
async function changePassword(){const status=document.getElementById('pw-status');const current=document.getElementById('pw-current').value,next=document.getElementById('pw-new').value,again=document.getElementById('pw-repeat').value;if(!current||!next){status.textContent=t('profile.fill_both');return}if(next.length<12){status.textContent=t('profile.min_length');return}if(next!==again){status.textContent=t('profile.mismatch');return}status.textContent=t('common.working');try{await api('/api/profile/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:current,new_password:next})});for(const id of ['pw-current','pw-new','pw-repeat'])document.getElementById(id).value='';status.textContent='';notify(t('profile.password_changed'),true)}catch(e){status.textContent=e.message}}
async function saveProfile(){const status=document.getElementById('profile-status');try{const r=await api('/api/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({telegram_username:document.getElementById('profile-username').value})});status.textContent=t('profile.username_updated');currentUser.telegram_username=r.telegram_username}catch(e){status.textContent=e.message}}
(async()=>{await loadLang(pickLang(''));try{currentUser=await api('/api/profile');if(!cookieLang()&&currentUser.language&&LANGS[currentUser.language]&&currentUser.language!==I18N.lang)await loadLang(currentUser.language);document.getElementById('nav-people').classList.toggle('hidden',!currentUser.can_manage_people);document.getElementById('login-screen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');showView('dashboard')}catch(e){showLogin()}})();
</script></body></html>
