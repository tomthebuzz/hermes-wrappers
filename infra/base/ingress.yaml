# Phase 4 artifact. Do NOT apply this until team-portal.example.com DNS points at
# the cluster's ingress controller and cert-manager (or equivalent) is
# installed — otherwise this just sits unsatisfied. For Phase 1-3
# dev/staging, reach the Service via `kubectl port-forward` or a
# tailnet-exposed NodePort instead; see infra/README.md.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: team-portal
  namespace: hermes-team
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # adjust to whatever issuer you actually run
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: ["team-portal.example.com"]
      secretName: team-portal-tls
  rules:
    - host: team-portal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: team-portal
                port:
                  number: 80
