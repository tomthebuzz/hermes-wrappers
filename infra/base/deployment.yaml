# kanban.db access: reads are a bind-mounted/PVC-mounted file (see the
# hermes-home volume below) — unaffected by containerization since SQLite
# WAL supports concurrent external readers. Writes go through
# hermes-bridge (../../hermes-bridge), a standalone service running
# natively next to the real Hermes install — this Deployment calls it over
# HTTP, never execs `hermes` itself. See that repo's README for why.
#
# The one open question this manifest still can't answer for you: WHERE
# that PVC comes from. If Hermes itself also runs in this cluster (e.g. a
# StatefulSet with its own PVC for ~/.hermes), mount that same PVC
# read-only here (assumed below, named hermes-home-pvc — defined wherever
# your core Hermes deployment lives, not scaffolded in this repo). If
# Hermes stays on a single external host instead, swap this PVC for
# whatever your cluster uses to reach that host's filesystem (NFS export,
# etc.) — hermes-bridge solves the CLI-exec problem, not the "where does
# the file live" problem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-portal
  namespace: futuretree
  labels:
    app: team-portal
spec:
  replicas: 1   # see app/auth/magic_link.py — token store is in-process and
                # single-instance only; raise replicas only after swapping
                # that for a shared store (Redis) and the Login Widget auth.
  selector:
    matchLabels:
      app: team-portal
  template:
    metadata:
      labels:
        app: team-portal
    spec:
      containers:
        - name: team-portal
          image: ghcr.io/tomthebuzz/team-portal:latest   # placeholder — build & push your own tag
          ports:
            - containerPort: 8080
          env:
            - name: KANBAN_DB_PATH
              value: /hermes-home/kanban.db
            - name: USERS_YAML_PATH
              value: /config/users.yaml
            - name: SHARED_CONFIG_DIR
              value: /shared-config
            - name: HERMES_BRIDGE_URL
              value: "http://hermes-bridge:8765"   # adjust to wherever hermes-bridge actually runs/is reachable from this cluster
            - name: HERMES_BRIDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-bridge-key
                  key: api_key
            - name: PORTAL_BASE_URL
              value: "https://futuretree.com"   # Phase 4 — tailnet URL for now, see infra README
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: team-portal-session
                  key: secret
          volumeMounts:
            - name: hermes-home
              mountPath: /hermes-home
              readOnly: true
            - name: users-config
              mountPath: /config
              readOnly: true
            - name: shared-config
              mountPath: /shared-config
              readOnly: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: hermes-home
          persistentVolumeClaim:
            claimName: hermes-home-pvc   # defined by the core Hermes deployment — see header note (Option A)
        - name: users-config
          secret:
            secretName: team-portal-users
        - name: shared-config
          configMap:
            name: team-shared-config   # see kustomization.yaml's configMapGenerator
