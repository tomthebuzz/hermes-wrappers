# users.yaml is access-control data (who can see/approve what), not a
# credential by itself, but treating it as a Secret rather than a
# ConfigMap means it's not readable by anyone with generic ConfigMap list
# access in the namespace — cheap extra layer for a file that's
# effectively your RBAC source of truth.
#
# This file is a TEMPLATE. Do not commit a real users.yaml with real
# Telegram IDs to this repo (it's gitignored at the repo root for the
# local-dev copy; this K8s version needs the same discipline — generate it
# at deploy time, don't hand-edit a committed Secret manifest).
#
# Recommended: generate with kubectl directly instead of applying this file verbatim:
#   kubectl create secret generic team-portal-users \
#     --from-file=users.yaml=../../users.yaml \
#     -n hermes-team --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: team-portal-users
  namespace: hermes-team
type: Opaque
stringData:
  users.yaml: |
    users: []
    defaults:
      unknown_user_tenants: []
      unknown_user_can_rollup: false
